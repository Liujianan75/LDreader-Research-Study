/* 阅读页视觉参数同步自 jdweb；实验条件共享相同的正文排版。 */
body.reader-page {
  --butter: #FFF0CC;
  --reader-header-height: 75px;
  height: 100vh;
  height: 100svh;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #FFF0CC;
  font-family: -apple-system, "Noto Sans", BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
.reader-page .topbar {
  height: var(--reader-header-height);
  min-height: var(--reader-header-height);
  flex: none;
  padding: 0 40px;
  gap: 20px;
  background: #c5dbb3;
  box-shadow: none;
}
.reader-page .brand { min-width: 99px; flex: none; }
.reader-logo { display: block; width: 99px; height: 45px; object-fit: contain; }
.reader-page .head-center { min-width: 0; max-width: none; height: 30px; gap: 0; overflow: hidden; }
.reader-page .booktab {
  flex: 1 1 136px;
  height: 30px;
  min-width: 72px;
  max-width: 180px;
  padding: 5px 12px;
  margin-right: -5px;
  border: 0;
  border-radius: 5px 5px 0 0;
  background: #C5D399;
  color: #4A6633;
  box-shadow: 2px -3px 4px rgba(139,182,103,.3);
  font-size: 14px;
  font-weight: 500;
  opacity: 1;
}
.reader-page .booktab.selected { background: #FFF0CC; color: #4A6633; z-index: 1; }
.reader-page .id-pill { border: 0; background: rgba(255,255,255,.38); color: #4A6633; font-weight: 500; }
.reader-page #preview-bar { position: relative; flex: none; }
.reader-page .preview-nav { padding: 8px 24px; }
.reader-page #app { display: flex; flex: 1; min-height: 0; overflow: hidden; }
.reader-page .reader-viewport { height: 100%; min-height: 0; width: 100%; }
.reader-page .reader-metadata { min-height: 46px; padding: 8px 28px; background: #FFF0CC; flex: none; }
.reader-page .reader-work-title { color: #4A6633; font-size: 14px; font-weight: 500; }
.reader-page .language-tabs { border-color: rgba(139,182,103,.5); border-radius: 30px; }
.reader-page .language-tabs button { background: transparent; color: #4A6633; padding: 6px 12px; font-size: 12px; }
.reader-page .language-tabs button[aria-pressed=true] { background: #C5D399; }
.reader-page #support-jump { border-color: rgba(139,182,103,.5); background: transparent; color: #4A6633; }
.reader-page .progress-track { height: 3px; flex: none; background: rgba(197,211,153,.35); }
.reader-page .progress-fill { background: #8BB667; }
.reader-page .reader-grid {
  display: grid;
  grid-template-columns: minmax(0,1fr) minmax(0,720px) minmax(0,1fr);
  grid-template-rows: minmax(0,1fr);
  overflow: hidden;
  background: #FFF0CC;
}
.reader-page .reader-body {
  order: initial;
  height: 100%;
  min-height: 0;
  max-height: none;
  padding: 70px 16px 60px;
  overscroll-behavior: contain;
}
.reader-page .reader-paragraphs {
  font-size: 24px;
  line-height: 1.5;
  letter-spacing: 0;
  font-weight: 400;
  color: #000;
  margin: 0 auto;
}
.reader-page .reader-paragraphs p { padding: 0; margin: 0 0 24px; overflow-wrap: anywhere; }
.reader-page .ai-anchor { background: rgba(139,182,103,.25); padding: 0; }
.reader-page .note-anchor { text-decoration-color: #8BB667; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.reader-page .reader-wing { order: initial; height: 100%; max-height: none; padding: 22px 20px 16px; gap: 14px; }
.reader-page .rail-heading { color: #4A6633; font-size: 12px; font-weight: 500; }
.reader-page .rail-caption { color: #6e845b; }
.reader-page .rail-empty { color: #7c8e66; }
.reader-page .margin-context { padding: 0 8px 8px; }
.reader-page .ai-margin-card { border: 0; border-radius: 10px; background: transparent; color: rgba(74,102,51,.9); margin-bottom: 12px; }
.reader-page .margin-card-title {
  position: sticky;
  top: 0;
  z-index: 1;
  min-height: 40px;
  padding: 9px 12px;
  border: 1px solid rgba(139,182,103,.5);
  border-radius: 10px;
  background: #8BB667;
  color: #fff;
  font-size: 16px;
  font-weight: 500;
  line-height: 21px;
}
.reader-page .margin-card-title > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reader-page .margin-card-title > span:last-child { flex: none; font-size: 16px; }
.reader-page .margin-card-title:hover,
.reader-page .margin-card-title[aria-expanded=true] { background: #C5D399; color: #4A6633; }
.reader-page .ai-margin-card > [data-ai-body] {
  margin: -1px 0 0 30px;
  border: 1px solid rgba(139,182,103,.5);
  border-top: 0;
  border-radius: 0 0 10px 10px;
  background: #C5D399;
  padding-top: 1px;
}
.reader-page .ai-margin-card:has(> [data-ai-body]:not([hidden])) > .margin-card-title { border-bottom-right-radius: 0; }
.reader-page .support-copy { font-size: 14px; line-height: 1.625; padding: 0 12px; }
.reader-page .source-button { margin: 0 12px 12px; color: #4A6633; background: rgba(255,240,204,.55); font-size: 11px; }
.reader-page .source { color: #4A6633; }
.reader-page .reader-margin-card { padding: 0; background: transparent; border: 0; color: rgba(74,102,51,.8); }
.reader-page .note-quote { width: 100%; background: #fff; color: rgba(74,102,51,.75); text-align: left; }
.reader-page .note-quote:hover,
.reader-page .note-quote[aria-expanded=true] { background: #fff; color: #4A6633; }
.reader-page .reader-margin-card:has(> [data-note-body]:not([hidden])) > .note-quote { border-bottom-left-radius: 0; }
.reader-page .reader-note-body { margin: -1px 30px 0 0; padding: 12px; border: 1px solid rgba(139,182,103,.5); border-top: 0; border-radius: 0 0 10px 10px; background: #fff; }
.reader-page .reader-note-body blockquote { border-left: 2px solid #C5D399; margin: 0 0 10px; padding-left: 9px; color: #757575; font-size: 12px; line-height: 1.625; }
.reader-page .reader-note-body p { margin: 0 0 12px; font-size: 14px; line-height: 1.625; }
.reader-page .note-locate { border: 0; background: transparent; padding: 0; font-size: 11px; color: #4A6633; text-decoration: underline; text-underline-offset: 3px; }
.reader-page .private-composer { background: rgba(255,255,255,.55); border-color: rgba(139,182,103,.5); border-radius: 10px; }
.reader-page .reader-toolbar { position: relative; flex: none; min-height: 64px; padding: 10px 24px; background: #FFF0CC; border-top: 1px solid rgba(139,182,103,.25); }
.reader-page .reader-toolbar .btn { background: #C5D399; border-color: #8BB667; color: #4A6633; border-radius: 10px; font-weight: 500; }
.reader-page .reader-body,
.reader-page .margin-context,
.reader-page .private-composer { scrollbar-width: thin; scrollbar-color: #c5dbb3 transparent; }
.reader-page .reader-body::-webkit-scrollbar,
.reader-page .margin-context::-webkit-scrollbar { width: 6px; }
.reader-page .reader-body::-webkit-scrollbar-thumb,
.reader-page .margin-context::-webkit-scrollbar-thumb { background: #c5dbb3; border-radius: 3px; }
.reader-page .reader-body::-webkit-scrollbar-thumb:hover,
.reader-page .margin-context::-webkit-scrollbar-thumb:hover { background: #a3c78f; }
@media (min-width:768px) and (max-width:1100px) {
  .reader-page .reader-grid { grid-template-columns: minmax(140px,1fr) minmax(0,720px) minmax(140px,1fr); }
  .reader-page .reader-wing { padding-left: 8px; padding-right: 8px; }
  .reader-page .support-copy { font-size: 13px; }
  .reader-page .margin-card-title { font-size: 13px; }
  .reader-page .ai-margin-card > [data-ai-body] { margin-left: 12px; }
  .reader-page .reader-note-body { margin-right: 12px; }
}
@media (min-width:768px) and (max-width:1023px) {
  body.reader-page { --reader-header-height: 72px; }
  .reader-page .topbar { padding: 0 24px; gap: 14px; }
  .reader-page .brand { min-width: 86px; }
  .reader-logo { width: 86px; height: 40px; }
  .reader-page .head-center { display: flex; }
  .reader-page .booktab { min-width: 64px; max-width: 140px; font-size: 13px; padding: 5px 10px; }
  .reader-page .id-pill { font-size: 10px; padding: 7px 9px; }
}
@media (max-width:767px) {
  body.reader-page { --reader-header-height: 60px; }
  .reader-page .topbar { padding: 0 12px; gap: 8px; }
  .reader-page .brand { min-width: 64px; }
  .reader-logo { width: 64px; height: 32px; }
  .reader-page .head-center { display: none; }
  .reader-page .id-pill { font-size: 10px; padding: 7px 9px; max-width: calc(100vw - 105px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reader-page .preview-nav { padding: 8px 12px; gap: 6px; }
  .reader-page .preview-nav > div { display: none; }
  .reader-page .preview-nav select { min-height: 32px; padding: 5px 8px; }
  .reader-page .preview-nav .btn { min-height: 32px; padding: 6px 9px; }
  .reader-page .reader-metadata { padding: 8px 12px; gap: 6px; }
  .reader-page .reader-work-title { font-size: 12px; }
  .reader-page .reader-metadata > div { gap: 5px; }
  .reader-page .language-tabs { margin-left: 0; }
  .reader-page .language-tabs button { font-size: 10px; padding: 5px 8px; }
  .reader-page #support-jump { max-width: 140px; font-size: 10px; }
  .reader-page .reader-grid { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) auto; }
  .reader-page .reader-space { display: none; }
  .reader-page .reader-body { grid-column: 1; grid-row: 1; padding: 24px 20px 40px; }
  .reader-page .reader-paragraphs { font-size: 24px; }
  .reader-page .reader-wing { grid-column: 1; grid-row: 2; height: clamp(150px,26svh,220px); max-height: none; padding: 8px 10px; gap: 5px; border-top: 1px solid rgba(139,182,103,.35); }
  .reader-page .condition-C2 .reader-grid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); }
  .reader-page .condition-C2 .reader-body { grid-column: 1 / 3; }
  .reader-page .condition-C2 .left-rail { grid-column: 1; }
  .reader-page .condition-C2 .right-rail { grid-column: 2; }
  .reader-page .condition-B .reader-grid { grid-template-rows: minmax(0,1fr); }
  .reader-page .rail-heading { font-size: 10px; }
  .reader-page .rail-caption { display: none; }
  .reader-page .margin-context { top: 0 !important; max-height: 100% !important; padding: 0 2px; }
  .reader-page .margin-card-title { min-height: 34px; font-size: 12px; padding: 6px 9px; }
  .reader-page .ai-margin-card > [data-ai-body] { margin-left: 10px; }
  .reader-page .reader-note-body { margin-right: 10px; padding: 8px; }
  .reader-page .support-copy { padding: 0 9px; font-size: 12px; }
  .reader-page .reader-note-body p { font-size: 12px; }
  .reader-page .reader-toolbar { padding: 8px 12px; min-height: 56px; gap: 8px; }

  .reader-page .reader-toolbar .btn { min-width: 150px; font-size: 12px; }
}
/* 设置与选词工具 */
.reader-page { --reader-bg:#FFF0CC; --reader-text:#000; --reader-font-size:24px; --reader-line-height:1.5; --reader-letter-spacing:0px; }
.reader-page .reader-grid,.reader-page .reader-metadata,.reader-page .reader-toolbar { background:var(--reader-bg); }
.reader-page .reader-paragraphs { font-size:var(--reader-font-size); line-height:var(--reader-line-height); letter-spacing:var(--reader-letter-spacing); color:var(--reader-text); }
.reader-page .reader-paragraphs > p,.reader-page .reader-paragraphs .bilingual-pair p { margin:0 0 1em; }
.reader-page .bilingual-pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:24px; }
.reader-page .bilingual-pair > p { min-width:0; }
.reader-page .bilingual-pair > p:last-child { border-left:1px solid rgba(139,182,103,.3); padding-left:16px; }
.reader-page .reader-paragraphs [data-fragment-language="original"] { text-align:start; }
.reader-page .head-actions { gap:10px; }
.reader-page .topbar { z-index:50; }
.reader-settings-wrap { position:relative; flex:none; }
.reader-page .reader-settings-trigger { color:#3d6a4b; }
.reader-page .reader-settings-trigger svg { width:27px; height:27px; }
.reader-settings-panel { position:absolute; right:0; top:calc(100% + 13px); z-index:40; width:268px; padding:12px 18px; background:#fff; border:1px solid #8bb66780; border-radius:6px; color:#4a6633; box-shadow:0 8px 30px #34532518; max-height:calc(100svh - 100px); overflow-y:auto; }
.reader-settings-title { display:flex; align-items:center; justify-content:center; position:relative; font-size:18px; font-weight:500; padding:1px 0 9px; }
.reader-settings-title button,.reader-dialog-heading > button,.reader-ai-heading > button { border:0; background:transparent; color:#668950; cursor:pointer; font-size:24px; line-height:1; }
.reader-settings-title button { position:absolute; right:-7px; top:0; }
.reader-setting-row { display:flex; align-items:center; gap:10px; padding:13px 0; border-bottom:1px solid #e2ebd8; font-size:16px; }
.reader-setting-row > label,.reader-setting-row > span { width:42px; flex:none; font-weight:500; line-height:1.1; }
.reader-settings-panel[lang=en] .reader-setting-row > label,.reader-settings-panel[lang=en] .reader-setting-row > span { width:65px; font-size:13px; }
.reader-setting-row select { min-width:0; width:100%; border:1px solid #adc99a; border-radius:6px; background:#fff; color:#4a6633; padding:5px 6px; font-size:14px; }
.reader-setting-row select:disabled { color:#6f825f; opacity:.65; }
.reader-range { display:flex; align-items:center; gap:5px; flex:1; min-width:0; flex-wrap:wrap; font-size:13px; color:#819775; position:relative; padding-bottom:10px; }
.reader-range input { appearance:none; -webkit-appearance:none; min-width:0; width:60px; flex:1; margin:0; height:4px; background:#e9f1e2; border-radius:3px; cursor:pointer; }
.reader-range input::-webkit-slider-thumb { appearance:none; -webkit-appearance:none; width:15px; height:15px; border-radius:50%; background:#7ca66a; box-shadow:0 1px 3px #49623730; }

    "paragraphs": [
      {
        "id": "en-1",
        "original": "On his bench in Madison Square Soapy moved uneasily. When wild geese honk high of nights, and when women without sealskin coats grow kind to their husbands, and when Soapy moves uneasily on his bench in the park, you may know that winter is near at hand.",

        "text": "一片枯叶落在索比的膝上。那是霜杰克的名片。杰克对麦迪逊广场的常住户很厚道，每年光临之前都给个公平的提醒。在四条街的拐角处，他把名片递给北风——那“露天大厦”的仆役——好让大厦里的居民们有所准备。"

      {

      },
      {
        "id": "en-4",
        "original": "The hibernatorial ambitions of Soapy were not of the highest. In them there were no considerations of Mediterranean cruises, of soporific Southern skies drifting in the Vesuvian Bay. Three months on the Island was what his soul craved. Three months of assured board and bed and congenial company, safe from Boreas and bluecoats, seemed to Soapy the essence of things desirable.",
        "text": "索比的冬眠抱负并不算高。其中没有考虑去地中海巡游，也没有考虑在维苏威湾里飘荡着令人昏昏欲睡的南方天空。他所渴望的，是在岛上待三个月。三个月有保障的食宿和投契的伙伴，免受北风和警察之害，在索比看来，这才是称心如意之事的精髓。"
      },
      {
        "id": "en-5",
        "original": "For years the hospitable Blackwell's had been his winter quarters. Just as his more fortunate fellow New Yorkers had bought their tickets to Palm Beach and the Riviera each winter, so Soapy had made his humble arrangements for his annual hegira to the Island. And now the time was come. On the previous night three Sabbath newspapers, distributed beneath his coat, about his ankles and over his lap, had failed to repulse the cold as he slept on his bench near the spurting fountain in the ancient square.",
        "text": "多年来，好客的布莱克韦尔监狱一直是他过冬的居所。正如那些比他幸运的纽约同胞每年冬天都买好去棕榈滩和里维埃拉的船票一样，索比也为他一年一度前往岛上的迁徙做了简朴的安排。而现在时候到了。前一夜，当他睡在古老广场上喷泉附近的长椅上时，三份星期日报纸——分别垫在他大衣底下、裹在脚踝处、盖在膝上——都未能抵挡住寒冷。"
      },
      {
        "id": "en-6",
        "original": "So the Island loomed big and timely in Soapy's mind. He scorned the provisions made in the name of charity for the city's dependents. In Soapy's opinion the Law was more benign than Philanthropy. There was an endless round of institutions, municipal and eleemosynary, on which he might set out and receive lodging and food accordant with the simple life. But to one of Soapy's proud spirit the gifts of charity are encumbered. If not in coin you must pay in humiliation of spirit for every benefit received at the hands of philanthropy. As Caesar had his Brutus, every bed of charity must have its toll of a bath, every loaf of bread its compensation of a private and personal inquisition. Wherefore it is better to be a guest of the law, which though conducted by rules, does not meddle unduly with a gentleman's private affairs.",
        "text": "于是，岛屿在索比的脑海中显得既庞大又及时。他鄙夷那些以慈善为名、为城市依附者所做的安排。在索比看来，法律比慈善更为仁慈。有无穷无尽的机构，市立的和救济性的，他可以前去，获得与简朴生活相称的住宿和食物。但对于索比这样一个骄傲的灵魂来说，慈善的馈赠是累赘的。在慈善之手接受的每一项好处，若非以金钱偿付，便须以精神上的屈辱来支付。正如凯撒有他的布鲁图斯，每一张慈善之床必有沐浴的代价，每一块面包必有私密而针对个人的盘问作为补偿。因此，不如做法律的客人，法律虽按规章行事，却不至于过分干涉绅士的私事。"

        "id": "en-9",
        "original": "Soapy had confidence in himself from the lowest button of his vest upward. He was shaven, and his coat was decent and his neat black, ready-tied four-in-hand had been presented to him by a lady missionary on Thanksgiving Day. If he could reach a table in the restaurant unsuspected success would be his. The portion of him that would show above the table would raise no doubt in the waiter's mind. A roasted mallard duck, thought Soapy, would be about the thing--with a bottle of Chablis, and then Camembert, a demi-tasse and a cigar. One dollar for the cigar would be enough. The total would not be so high as to call forth any supreme manifestation of revenge from the cafe management; and yet the meat would leave him filled and happy for the journey to his winter refuge.",

        "id": "en-11",

      {
        "id": "en-12",
        "original": "At a corner of Sixth Avenue electric lights and cunningly displayed wares behind plate-glass made a shop window conspicuous. Soapy took a cobblestone and dashed it through the glass. People came running around the corner, a policeman in the lead. Soapy stood still, with his hands in his pockets, and smiled at the sight of brass buttons.",
        "text": "在第六大道的一个街角，电灯和橱窗玻璃后面巧妙陈列的商品使一家商店的橱窗格外引人注目。索比捡起一块鹅卵石，猛砸玻璃。人们从拐角处跑来，一名警察领头。索比站在原地，双手插在口袋里，看到铜纽扣便笑了。"
      },
      {
        "id": "en-13",

      },
      {
        "id": "en-14",
        "original": "\"Don't you figure out that I might have had something to do with it?\" said Soapy, not without sarcasm, but friendly, as one greets good fortune.",

      },
      {
        "id": "en-15",
        "original": "The policeman's mind refused to accept Soapy even as a clue. Men who smash windows do not remain to parley with the law's minions. They take to their heels. The policeman saw a man half way down the block running to catch a car. With drawn club he joined in the pursuit. Soapy, with disgust in his heart, loafed along, twice unsuccessful.",
        "text": "警察的脑子根本不肯把索比当成线索。砸窗户的人不会留下来跟法律的爪牙攀谈。他们会拔腿就跑。警察看见一个人在半条街外跑着去赶车。他抽出警棍，加入了追捕。索比心里一阵厌恶，懒洋洋地往前走，两次都没成功。"
      },
      {
        "id": "en-16",
        "original": "On the opposite side of the street was a restaurant of no great pretensions. It catered to large appetites and modest purses. Its crockery and atmosphere were thick; its soup and napery thin. Into this place Soapy took his accusive shoes and telltale trousers without challenge. At a table he sat and consumed beefsteak, flapjacks, doughnuts and pie. And then to the waiter be betrayed the fact that the minutest coin and himself were strangers.",
        "text": "街道对面是一家没什么气派的餐馆。它迎合的是大胃口和瘪钱包。它的碗碟厚实，氛围也浓厚；汤水稀薄，餐巾也单薄。索比带着他那双惹人注目的鞋和露馅的裤子走进这个地方，无人阻拦。他在一张桌旁坐下， consumed 牛排、煎饼、甜甜圈和派。然后他向服务员暴露了一个事实：最小的硬币和他本人素不相识。"
      },
      {
        "id": "en-17",
        "original": "\"Now, get busy and call a cop,\" said Soapy. \"And don't keep a gentleman waiting.\"",
        "text": "“现在，赶紧去叫警察，”索比说。“别让一位绅士等着。”"
      },
      {
        "id": "en-18",
        "original": "\"No cop for youse,\" said the waiter, with a voice like butter cakes and an eye like the cherry in a Manhattan cocktail. \"Hey, Con!\"",
        "text": "“不给你这种人叫警察，”侍者说，声音像黄油蛋糕，眼睛像曼哈顿鸡尾酒里的樱桃。“嘿，康！”"
      },
      {
        "id": "en-19",
        "original": "Neatly upon his left ear on the callous pavement two waiters pitched Soapy. He arose, joint by joint, as a carpenter's rule opens, and beat the dust from his clothes. Arrest seemed but a rosy dream. The Island seemed very far away. A policeman who stood before a drug store two doors away laughed and walked down the street.",
        "text": "两个侍者干净利落地把索比撂倒在他左耳边的硬邦邦的人行道上。他像木匠的折尺一样一节一节地撑起身来，拍掉衣服上的尘土。被捕似乎只是一个玫瑰色的梦。那个岛显得非常遥远。一个站在两家门面外一家药店前的警察笑了笑，沿街走去了。"
      },
      {
        "id": "en-20",
        "original": "Five blocks Soapy travelled before his courage permitted him to woo capture again. This time the opportunity presented what he fatuously termed to himself a \"cinch.\" A young woman of a modest and pleasing guise was standing before a show window gazing with sprightly interest at its display of shaving mugs and inkstands, and two yards from the window a large policeman of severe demeanour leaned against a water plug.",
        "text": "索比走了五个街区，勇气才允许他再次去招惹被捕。这一次，机会向他呈现了他自己在心里愚蠢地称之为“十拿九稳”的东西。一个衣着朴素而讨人喜欢的年轻女子站在一家橱窗前，兴致勃勃地凝视着里面陈列的剃须杯和墨水台，离橱窗两码远的地方，一个神态严厉的大个子警察靠在一个消防栓上。"
      },
      {
        "id": "en-21",
        "original": "It was Soapy's design to assume the role of the despicable and execrated \"masher.\" The refined and elegant appearance of his victim and the contiguity of the conscientious cop encouraged him to believe that he would soon feel the pleasant official clutch upon his arm that would insure his winter quarters on the right little, tight little isle.",
        "text": "索比打算扮演那种令人鄙夷、遭人唾弃的“调戏妇女者”。他选中的对象举止优雅、衣着得体，而旁边又恰有一位尽职的警察，这让他相信自己很快就能感受到那只官方的手愉快地抓住他的胳膊——那将确保他在那“小巧玲珑、严丝合缝的小岛”上度过冬天。"
      },
      {
        "id": "en-22",
        "original": "Soapy straightened the lady missionary's readymade tie, dragged his shrinking cuffs into the open, set his hat at a killing cant and sidled toward the young woman. He made eyes at her, was taken with sudden coughs and \"hems,\" smiled, smirked and went brazenly through the impudent and contemptible litany of the \"masher.\" With half an eye Soapy saw that the policeman was watching him fixedly. The young woman moved away a few steps, and again bestowed her absorbed attention upon the shaving mugs. Soapy followed, boldly stepping to her side, raised his hat and said:",
        "text": "索比整了整那位女传教士的现成领带，把缩进去的袖口拽出来，把帽子歪戴成一个勾魂的角度，然后侧身朝那位年轻女子凑过去。他向她挤眉弄眼，突然咳嗽几声、“哼”了几声，笑一笑，假笑一下，然后厚颜无耻地把那套无礼而可鄙的“调戏妇女者”的连篇鬼话从头到尾演了一遍。索比用半只眼睛瞟见那警察正一动不动地盯着他。那年轻女子挪开了几步，又全神贯注地看起了那些刮胡子用的杯子。索比跟了上去，大胆地走到她身边，举起帽子说道："
      },
      {
        "id": "en-23",

      },
      {
        "id": "en-24",
        "original": "The policeman was still looking. The persecuted young woman had but to beckon a finger and Soapy would be practically en route for his insular haven. Already he imagined he could feel the cozy warmth of the station-house. The young woman faced him and, stretching out a hand, caught Soapy's coat sleeve.",

      },
      {

        "text": "“当然，迈克，”她快活地说，“只要你请我喝一桶啤酒。我本来想早点跟你搭话的，但那个警察一直在盯着。”"
      },
      {
        "id": "en-26",
        "original": "With the young woman playing the clinging ivy to his oak Soapy walked past the policeman overcome with gloom. He seemed doomed to liberty.",

      {
        "id": "en-27",
        "original": "At the next corner he shook off his companion and ran. He halted in the district where by night are found the lightest streets, hearts, vows and librettos.",

      },
      {
        "id": "en-28",
        "original": "Women in furs and men in greatcoats moved gaily in the wintry air. A sudden fear seized Soapy that some dreadful enchantment had rendered him immune to arrest. The thought brought a little of panic upon it, and when he came upon another policeman lounging grandly in front of a transplendent theatre he caught at the immediate straw of \"disorderly conduct.\"",
        "text": "穿皮衣的女人和穿大衣的男人在冬日的空气中欢快地走动。索比突然感到一阵恐惧，莫非有什么可怕的魔法让他免于被捕。这个念头让他有些惊慌，当他遇到另一名警察气派十足地闲站在一座灯火辉煌的剧院门前时，他立刻抓住了“妨害治安”这根救命稻草。"

      {
        "id": "en-29",
        "original": "On the sidewalk Soapy began to yell drunken gibberish at the top of his harsh voice. He danced, howled, raved and otherwise disturbed the welkin.",
        "text": "在人行道上，索比开始用他那沙哑的嗓子扯着醉醺醺的胡言乱语大声嚷嚷。他又跳又嚎，疯言疯语，搅得天空都不得安宁。"
      },
      {
        "id": "en-30",
        "original": "The policeman twirled his club, turned his back to Soapy and remarked to a citizen.",
        "text": "警察转动着警棍，背过身去，对一位市民说道。"
      },
      {
        "id": "en-31",
        "original": "\"'Tis one of them Yale lads celebratin' the goose egg they give to the Hartford College. Noisy; but no harm. We've instructions to lave them be.\"",
        "text": "“这是那些耶鲁小子中的一个，在庆祝他们让哈特福德学院吃了鸭蛋。吵是吵了点，但没什么害处。我们有指示，随他们去。”"
      },
      {
        "id": "en-32",
        "original": "Disconsolate, Soapy ceased his unavailing racket. Would never a policeman lay hands on him? In his fancy the Island seemed an unattainable Arcadia. He buttoned his thin coat against the chilling wind.",
        "text": "索比沮丧地停止了徒劳的喧闹。难道永远不会有警察对他动手吗？在他的想象中，那个岛似乎成了一个遥不可及的世外桃源。他扣紧薄外套的扣子，抵御着刺骨的寒风。"
      },
      {
        "id": "en-33",
        "original": "In a cigar store he saw a well-dressed man lighting a cigar at a swinging light. His silk umbrella he had set by the door on entering. Soapy stepped inside, secured the umbrella and sauntered off with it slowly. The man at the cigar light followed hastily.",
        "text": "在一家雪茄店里，他看见一个衣着考究的男人正就着来回摆动的吊灯点雪茄。进门时，那人把自己的绸伞放在了门边。索比走了进去，拿起伞，慢悠悠地带着它溜了出去。点雪茄的那个人急忙跟了上来。"
      },
      {
        "id": "en-34",
        "original": "\"My umbrella,\" he said, sternly.",
        "text": "“我的伞，”他厉声说道。"
      },
      {
        "id": "en-35",
        "original": "\"Oh, is it?\" sneered Soapy, adding insult to petit larceny. \"Well, why don't you call a policeman? I took it. Your umbrella! Why don't you call a cop? There stands one on the corner.\"",
        "text": "“哦，是吗？”索比讥笑道，在小偷小摸之外又添了一份侮辱。“那好，你干吗不叫警察？我拿了。你的伞！干吗不叫巡警？街角就站着一个呢。”"
      },
      {
        "id": "en-36",
        "original": "The umbrella owner slowed his steps. Soapy did likewise, with a presentiment that luck would again run against him. The policeman looked at the two curiously.",
        "text": "伞的主人放慢了脚步。索比也放慢了脚步，他预感到运气又要跟他作对了。警察好奇地打量着这两个人。"
      },
      {
        "id": "en-37",
        "original": "\"Of course,\" said the umbrella man--\"that is--well, you know how these mistakes occur--I--if it's your umbrella I hope you'll excuse me--I picked it up this morning in a restaurant--If you recognise it as yours, why--I hope you'll--\"",
        "text": "“当然，”伞的主人说——“也就是说——唉，你知道这种差错是怎么发生的——我——如果那是您的伞，希望您能原谅我——我今天早上在一家餐馆里捡到的——如果您认出来是您的，那——希望您——”"
      },
      {
        "id": "en-38",
        "original": "\"Of course it's mine,\" said Soapy, viciously.",
        "text": "“当然是我的，”索比恶狠狠地说。"
      },
      {
        "id": "en-39",
        "original": "The ex-umbrella man retreated. The policeman hurried to assist a tall blonde in an opera cloak across the street in front of a street car that was approaching two blocks away.",
        "text": "那个 former 伞主人退却了。警察急忙赶去协助一位身披歌剧斗篷的高个金发女子穿过街道，避开一辆从两个街区外驶来的有轨电车。"
      },
      {
        "id": "en-40",
        "original": "Soapy walked eastward through a street damaged by improvements. He hurled the umbrella wrathfully into an excavation. He muttered against the men who wear helmets and carry clubs. Because he wanted to fall into their clutches, they seemed to regard him as a king who could do no wrong.",
        "text": "索比沿着一条因施工而破损的街道向东走去。他怒气冲冲地把伞扔进一个基坑里。他低声咒骂那些戴头盔、扛警棍的人。因为他想落入他们的掌心，他们却似乎把他当成一个不会做错事的国王。"
      },
      {
        "id": "en-41",
        "original": "At length Soapy reached one of the avenues to the east where the glitter and turmoil was but faint. He set his face down this toward Madison Square, for the homing instinct survives even when the home is a park bench.",
        "text": "终于，索比走到一条通往东边的大道上，那里的繁华与喧嚣已经微弱。他朝麦迪逊广场的方向走去，因为归巢的本能即使在家只是一张公园长椅时也依然存在。"
      },
      {
        "id": "en-42",
        "original": "But on an unusually quiet corner Soapy came to a standstill. Here was an old church, quaint and rambling and gabled. Through one violet-stained window a soft light glowed, where, no doubt, the organist loitered over the keys, making sure of his mastery of the coming Sabbath anthem. For there drifted out to Soapy's ears sweet music that caught and held him transfixed against the convolutions of the iron fence.",
        "text": "然而，在一个异常安静的街角，索比停下了脚步。这里有一座古老的教堂，古朴别致，布局错落，带有山墙。透过一扇染成紫色的窗户，透出柔和的光，风琴师无疑正在琴键上流连，确保自己熟练掌握即将到来的安息日赞美诗。因为飘进索比耳中的甜美音乐将他牢牢定住，使他紧贴着铁栅栏的蜿蜒曲线一动不动。"
      },
      {
        "id": "en-43",
        "original": "The moon was above, lustrous and serene; vehicles and pedestrians were few; sparrows twittered sleepily in the eaves--for a little while the scene might have been a country churchyard. And the anthem that the organist played cemented Soapy to the iron fence, for he had known it well in the days when his life contained such things as mothers and roses and ambitions and friends and immaculate thoughts and collars.",
        "text": "月亮高悬，皎洁而宁静；车辆和行人寥寥无几；麻雀在屋檐下困倦地啁啾——有那么一会儿，这景象简直像一座乡间教堂的墓地。而管风琴师奏响的赞美诗将索比牢牢地钉在铁栅栏旁，因为在他生活中还拥有母亲、玫瑰、抱负、朋友、纯洁的思想和衣领这些东西的日子里，他就对这曲子耳熟能详。"
      },
      {
        "id": "en-44",
        "original": "The conjunction of Soapy's receptive state of mind and the influences about the old church wrought a sudden and wonderful change in his soul. He viewed with swift horror the pit into which he had tumbled, the degraded days, unworthy desires, dead hopes, wrecked faculties and base motives that made up his existence.",
        "text": "索比 receptive 的心境与古老教堂周围氛围的结合，在他灵魂中引发了突然而奇妙的变化。他迅速而惊恐地审视了自己跌入的深渊，那构成他全部存在的堕落日子、卑劣欲望、死去的希望、荒废的才能和卑下的动机。"
      },
      {
        "id": "en-45",
        "original": "And also in a moment his heart responded thrillingly to this novel mood. An instantaneous and strong impulse moved him to battle with his desperate fate. He would pull himself out of the mire; he would make a man of himself again; he would conquer the evil that had taken possession of him. There was time; he was comparatively young yet; he would resurrect his old eager ambitions and pursue them without faltering. Those solemn but sweet organ notes had set up a revolution in him.",
        "text": "而刹那间，他的心也对这种新奇的 mood 起了 thrilling 的回应。一股瞬间而强烈的冲动驱使他去与那绝望的命运搏斗。他要将自己从泥潭中拉出来；他要重新做个男子汉；他要战胜那已经占据了他的邪念。还有时间；他相对来说还年轻；他要复活昔日那热切的抱负，毫不动摇地去追求它们。那些庄严而甜美的管风琴音符已在他心中引发了一场革命。"
      },
      {
        "id": "en-46",
        "original": "To-morrow he would go into the roaring downtown district and find work. A fur importer had once offered him a place as driver. He would find him to-morrow and ask for the position. He would be somebody in the world. He would--",
        "text": "明天他就到那喧闹的市中心去找工作。有个皮货进口商曾给他提供一个司机的职位。明天他就去找那人，请求得到那个位置。他要在这个世界上成为一个人物。他要——"
      },
      {
        "id": "en-47",
        "original": "Soapy felt a hand laid on his arm. He looked quickly around into the broad face of a policeman.",
        "text": "索比感到一只手搭在他的手臂上。他迅速环顾四周，看到了一名警察宽阔的脸庞。"
      },
      {
        "id": "en-48",
        "original": "\"What are you doin' here?\" asked the officer.",
        "text": "“你在这里做什么？”警官问道。"
      },
      {
        "id": "en-49",
        "original": "\"Nothin',\" said Soapy.",
        "text": "“没什么，”索比说。"
      },
      {
        "id": "en-50",
        "original": "\"Then come along,\" said the policeman.",
        "text": "“那就跟我走，”警察说。"
      },
      {
        "id": "en-51",
        "original": "\"Three months on the Island,\" said the Magistrate in the Police Court the next morning.",
        "text": "“在岛上待三个月，”第二天早上，警察法庭的治安法官说道。"
      }

    "version": "docx-context-v5",
    "paragraphs": [
      {
        "id": "ko-1",
        "original": "저놈의 인력거군이 저렇게 술이 취해가지고 이 진 땅에 어찌 가노, 라고 길 가는 사람이 걱정을 하리만큼 그의 걸음은 황급하였다. 흐리고 비오는 하늘은 어둠침침하게 벌써 황혼에 가까운 듯하다. 창경원 앞까지 다달아서야 그는 턱에 닿은 숨을 돌리고 걸음도 늦추잡았다. 한 걸음 두 걸음 집이 가까와올수록 그의 마음조차 괴상하게 누그러웠다. 그런데 이 누그러움은 안심에서 오는 게 아니요, 자기를 덮친 무서운 불행을 빈틈없이 알게 될 때가 박두한 것을 두려워하는 마음에서 오는 것이다.",
        "text": "那个拉人力车的家伙醉成那样，怎么在这泥泞的路上走啊——路上行人担心到这种程度的匆忙脚步。阴沉的雨天天空昏暗，似乎已经接近黄昏了。直到到了昌庆苑前，他才喘过气来，放慢了脚步。一步一步离家越近，他的心也奇怪地越发松弛下来。然而这松弛并非来自安心，而是来自恐惧——恐惧于将要毫不留情地认清那席卷自己的可怕不幸的时刻即将到来。"
      },
      {
        "id": "ko-2",
        "original": "그는 불행에 다닥치기 전 시간을 얼마쯤이라도 늘리려고 버르적거렸다. 기적(奇蹟)에 가까운 벌이를 하였다는 기쁨을 할 수 있으면 오래 지니고 싶었다. 그는 두리번두리번 사면을 살피었다. 그 모양은 마치 자기 집, 곧 불행을 향하고 달려가는 제 다리를 제 힘으로는 도저히 어찌할 수 없으니 누구든지 나를 좀 잡아 다고, 구해 다고 하는 듯하였다.",
        "text": "他在不幸逼近之前，尽可能地挣扎着想要多拖延一些时间。哪怕是奇迹般的收入，那份喜悦他也想尽可能长久地保有。他东张西望地打量着四周。那模样仿佛在说：自己的家——也就是正朝着不幸奔去的这两条腿，凭自己的力量实在无可奈何，所以不管是谁，请拉住我、救救我吧。"
      },
      {
        "id": "ko-3",
        "original": "그럴 즈음에 마침 길가 선술집에서 그의 친구 치삼이가 나온다. 그의 우글우글 살찐 얼굴에 주홍이 돋는 듯, 온 턱과 뺨을 시커멓게 구레나룻이 덮였거늘, 노르탱탱한 얼굴이 바짝 말라서 여기저기 고랑이 패고, 수염도 있대야 턱밑에만 마치 솔잎 송이를 거꾸로 붙여놓은 듯한 김 첨지의 풍채하고는 기이한 대상을 짓고 있었다.",
        "text": "就在那时，恰巧路边的小酒馆里走出了他的朋友致三。他那圆滚滚胖乎乎的脸上仿佛泛起了朱红，整个下巴和脸颊都被乌黑的络腮胡子覆盖着；而金佥知则是一张黄灿灿的脸瘦得紧巴巴的，到处刻着沟壑，胡子嘛，也只在下巴底下像是倒贴了一簇松针似的——两人站在一起，形成了奇异的对照。"
      },
      {
        "id": "ko-4",
        "original": "“여보게 김 첨지, 자네 문안 들어갔다 오는 모양일세그려. 돈 많이 벌었을 테니 한 잔 빨리게.”",
        "text": "“喂，金佥知，瞧你这模样是去吊丧回来了吧。准是挣了不少钱，快请我喝一杯。”"

        "text": "胖子一见到瘦子就嚷了起来。那嗓门跟他的身板截然不同，又柔又和气。金佥知见到这位朋友，不知有多高兴。简直像见了救命恩人似的感激不尽。"

        "text": "小酒馆里暖烘烘、热乎乎的。每当掀开熬泥鳅汤的锅盖，白蒙蒙的热气便腾腾升起；铁网上嗞啦嗞啦烤着的烤牛肉、猪肉、肝、腰子、明太鱼、绿豆煎饼……乱七八糟地摆满了一桌子下酒菜，金佥知突然胃里一阵酸痛，难以忍受。若能随心所欲，就是把那里所有的吃食统统吞下去也不解馋。可是饿肚子的人先要了两张分量足的绿豆煎饼，又要了一碗泥鳅汤。"

        "text": "饥饿的肠胃一尝到食物的味道，就更加空落落地一个劲儿催促着“端上来、端上来”。转眼间，一碗放着豆腐和泥鳅的汤就像喝水一样灌了下去。接过第三碗时，温着的米酒满满两碗也热好了。和致三一起喝下去，本就空空如也的肚子一阵刺刺地舒展开来，脸上火辣辣的。又压着喝了一碗满杯。"

      {
        "id": "ko-16",
        "original": "“이놈아, 이걸 먹고 취할 내냐, 어서 더 먹어.”하고는 치삼의 귀를 잡아채며 취한 이는 부르짖었다. 그리고 술을 붓는 열 다섯 살 됨직한 중대가리에게로 달려들며, “이놈, 오라질 놈, 왜 술을 붓지 않어.”라고 야단을 쳤다. 중대가리는 히히 웃고 치삼을 보며 문의하는 듯이 눈짓을 하였다. 주정꾼이 눈치를 알아보고 화를 버럭내며, “에미를 붙을 이 오라질 놈들 같으니, 이놈 내가 돈이 없을 줄 알고.”하자마자 허리춤을 훔칫훔칫 하더니 일 원짜리 한 장을 꺼내어 중대가리 앞에 펄쩍 집어던졌다. 그 사품에 몇 푼 은전이 잘그랑 하며 떨어진다.",
        "text": "“你这小子，就这点酒能醉得了我？快，再喝。”说着揪住致三的耳朵，醉汉大声嚷嚷起来。接着又冲到斟酒的十五岁上下的伙计跟前，“你这小子，混账东西，怎么不斟酒！”大声呵斥起来。伙计嘻嘻笑着，朝致三看去，像是用眼神询问。那醉汉察觉了，勃然大怒：“你们这些该挨娘骂的混账东西，你小子以为我没钱么！”话音未落，手在腰间摸索了一阵，掏出一块一元票子，啪地摔在伙计面前。就在这一刹那，几枚银钱叮叮当当掉了下来。"
      },
      {
        "id": "ko-17",
        "original": "“여보게 돈 떨어졌네, 왜 돈을 막 끼얹나.” 이런 말을 하며 일변 돈을 줍는다. 김 첨지는 취한 중에도 돈의 거처를 살피는 듯이 눈을 크게 떠서 땅을 내려다보다가 불시에 제 하는 짓이 너무 더럽다는 듯이 고개를 소스라치자 더욱 성을 내며, “봐라 봐! 이 더러운 놈들아, 내가 돈이 없나, 다리뼉다구를 꺾어놓을 놈들 같으니.”하고 치삼의 주워주는 돈을 받아, “이 원수엣 돈! 이 육시를 할 돈!”하면서, 풀매질을 친다. 벽에 맞아 떨어진 돈은 다시 술 끓이는 양푼에 떨어지며 정당한 매를 맞는다는 듯이 쨍하고 울었다.",
        "text": "“喂，钱掉了，干嘛乱撒钱啊。”他一边说着，一边捡钱。金佥知在醉意中也不忘留意钱的去向，睁大眼睛低头看着地面，忽然像是觉得自己刚才的举动太肮脏似的，猛地摇了摇头，更加恼怒地说道：“看吧！看吧！你们这些脏东西，我没钱吗？你们这些该打断腿的家伙！”说着接过致三捡起来的钱，“这冤家钱！这该千刀万剐的钱！”一边拿钱往墙上猛摔。钱撞到墙上弹落下来，又掉进煮酒的铜盆里，像是挨了正当的一顿打似的，叮当一声响了。"
      },
      {
        "id": "ko-18",
        "original": "곱배기 두 잔은 또 부어질 겨를도 없이 말려가고 말았다. 김 첨지는 입술과 수염에 붙은 술을 빨아들이고 나서 매우 만족한 듯이 그 솔잎 송이 수염을 쓰다듬으며, “또 부어, 또 부어.”라고, 외쳤다.",
        "text": "两杯酒还没来得及再倒上，就又喝干了。金佥知吮吸完嘴唇和胡须上沾的酒，显得十分满足，捋了捋那松针似的胡须，喊道：“再倒，再倒！”"
      },
      {
        "id": "ko-19",

        "text": "又喝了一杯后，金佥知拍着致三的肩膀，忽然哈哈大笑起来。那笑声大得酒馆里所有人的目光都集中到了金佥知身上。笑的人笑得更厉害了，说道：“喂，致三，我给你讲个好笑的事吧。今天我收了工，不是还去了车站吗。”"
      },
      {
        "id": "ko-20",
        "original": "“그래서.”",
        "text": "“所以嘛。”"

      {
        "id": "ko-21",
        "original": "“갔다가 그저 오기가 안 됐데그려. 그래 전차 정류장에서 어름어름하며 손님 하나를 태울 궁리를 하지 않았나. 거기 마침 마나님이신지 여학생님이신지, 요새야 어디 논다니와 아가씨를 구별할 수가 있던가, <망토>를 두르고 비를 맞고 서 있겠지. 슬근슬근 가까이 가서 인력거 타시랍시요 하고 손가방을 받으랴니까 내 손을 탁 뿌리치고 홱 돌아서더니만 <왜 남을 이렇게 귀찮게 굴어!> 그 소리야말로 꾀꼬리 소리지, 허허!”",
        "text": "“去了总不能白跑一趟吧。可不是嘛，我在电车站磨磨蹭蹭，盘算着拉一位客人。正好那儿不知是太太还是女学生——这年头哪分得清妓女和小姐啊——披着<斗篷>站在雨里。我悄悄凑过去说‘您坐人力车吧’，伸手要接她的手提包，她一把甩开我的手，猛地转过身来：‘干嘛这么烦人！’那声音真跟黄莺叫似的，哈哈！”"

        "text": "“该死的机灵鬼丫头，谁把她怎么着了，‘干嘛这么烦人！’哎哟，这话说得也太没分寸了，哈哈。”"

        "text": "笑声更大了。然而笑声还没消失，金佥知就开始抽抽搭搭地哭了起来。"

        "text": "致三莫名其妙地看着这个醉鬼，说：“刚还笑着胡闹，这又哭什么？”"

      {

      {
        "id": "ko-27",

      {

      {
        "id": "ko-29",

      {
        "id": "ko-30",

        "text": "“撒什么谎，真死了，真的……把老婆的尸首扔在家里，我居然跑出来喝酒，我是该杀的，该杀的。”金佥知放声大哭起来。"

      {

        "text": "致三兴致被打断了几分，一脸扫兴地说：“嘿，你这人，到底说的是真话还是假话。那就回家去吧，走。”说着拽住哭者的胳膊拉他走。"

      {
        "id": "ko-34",
        "original": "“죽기는 왜 죽어, 생때같이 살아만 있단다. 그 오라질 년이 밥을 죽이지. 인제 나한테 속았다.”하고 어린애 모양으로 손뼉을 치며 웃는다.",
        "text": "“死什么死，活得好好的呢。那臭娘们就是不好好吃饭。现在可被我骗了。”像小孩子似的拍着手笑。"
      },
      {
        "id": "ko-35",
        "original": "“이 사람이 정말 미쳤단 말인가. 나도 아주먼네가 앓는단 말은 들었는데.”하고, 치삼이도 어느 불안을 느끼는 듯이 김 첨지에게 또 돌아가라고 권하였다.",

      {
        "id": "ko-36",

      {
        "id": "ko-37",
        "original": "김 첨지는 홧증을 내며 확신있게 소리를 질렀으되 그 소리엔 안 죽은 것을 믿으려고 애쓰는 가락이 있었다. 기어이 일 원어치를 채워서 곱배기 한 잔씩 더 먹고 나왔다. 궂은 비는 의연히 추적추적 내린다.",
        "text": "金佥知发着狠，确信地大声喊道——可那声音里有一种拼命想让自己相信她没死的调子。到底凑够了一块钱的份，又各喝了一碗双份，才出来。阴雨依然淅淅沥沥地下着。"
      },
      {
        "id": "ko-38",
        "original": "김 첨지는 취중에도 설렁탕을 사가지고 집에 다달았다. 집이라 해도 물론 셋집이요, 또 집 전체를 세든 게 아니라 안과 뚝떨어진 행랑방 한 간을 빌려 든 것인데 물을 길어대고 한 달에 일 원씩 내는 터이다. 만일 김 첨지가 주기를 띠지 않았던들 한 발을 대문에 들여놓았을 제 그곳을 지배하는 무시무시한 정적(靜寂), 폭풍우가 지나간 뒤의 바다 같은 정적에 다리가 떨렸으리라.",
        "text": "金佥知即便醉着，也买了雪浓汤回到家门前。说是家，当然也是租来的房子，而且并非整栋租下，只是租了与正屋隔开的一间廊房，挑水供用，每月付一元租金。倘若金佥知没有带着醉意，当他一脚踏进大门时，支配那地方的可怕的寂静——如同暴风雨过后大海般的寂静——定会让他双腿发颤。"
      },
      {
        "id": "ko-39",
        "original": "쿨룩거리는 기침 소리도 들을 수 없다. 그르렁거리는 숨소리조차 들을 수 없다. 다만 이 무덤같은 침묵을 깨뜨리는, 깨뜨린다느니보다 한층 더 침묵을 깊게 하고 불길하게 하는 빡빡하는 그윽한 소리, 어린애의 젖 빠는 소리가 날 뿐이다. 만일 청각(聽覺)이 예민한 이 같으면 그 빡빡 소리는 빨 따름이요, 꿀떡꿀떡 하고 젖 넘어가는 소리가 없으니 빈 젖을 빤다는 것도 짐작할는지 모르리라.",
        "text": "听不见呼噜呼噜的咳嗽声，连喉间咯咯的喘息声也听不到。唯有打破这坟墓般沉默的——与其说打破，不如说使沉默更深、更不祥的——咂咂的幽微声响，只有婴儿吮奶的声音。若是听觉敏锐的人，或许能猜到那咂咂声只是干吮，没有咕咚咕咚咽奶的声音，因此吮的是空奶。"

      {

        "text": "或许金佥知也察觉到了这不祥的沉默。否则他一进大门就一反常态地高喊：“你这挨千刀的婆娘，丈夫回来了也不出来看看，这该死的婆娘！”——这就可疑了。这一声高喊，正是为了驱散袭向自身的可怕征兆而虚张声势罢了。"
      },

        "id": "ko-41",

        "text": "无论如何，金佥知猛地推开了房门。让人作呕的臭气——从脱落的草席底下冒出来的灰尘味、没洗的尿布散发出的屎尿味、沾满各色污渍的衣服的酸腐味、病人汗水的腐烂味——混合在一起的恶臭，刺痛了迟钝的金佥知的鼻子。"
      },
      {

        "text": "一走进房间，连把一碗雪浓汤放下的工夫都没有，醉汉就扯着嗓子放声呵斥道："

      {
        "id": "ko-43",
        "original": "“이런 오라질 년, 주야장천(晝夜長川) 누워만 있으면 제일이야! 남편이 와도 일어나지를 못해.”라는 소리와 함께 발길로 누운 이의 다리를 몹시 찼다. 그러나 발길에 채이는 건 사람의 살이 아니고 나무등걸과 같은 느낌이 있었다. 이때에 빽빽 소리가 응아 소리로 변하였다. 개똥이가 물었던 젖을 빼어놓고 운다. 운대도 온 얼굴을 찡그려 붙여서, 운다는 표정을 할 뿐이다. 응아 소리도 입에서 나는 게 아니고 마치 뱃속에서 나는 듯하였다. 울다가 울다가 목도 잠겼고 또 울 기운조차 시진한 것 같다.",
        "text": "“你这个该死的娘们儿，成天躺着就是头等大事了！丈夫来了也起不来。”说着便抬脚狠狠踢了躺着的人的大腿。然而脚下踩到的不是人的皮肉，而是像树桩一样的感觉。这时，嘤嘤的哭声变成了哇哇的哭声。狗屎儿吐出含过的奶头哭了起来。虽然哭着，整张脸却皱成一团，只是一副哭的表情罢了。哇哇的声音也不像是从嘴里发出来的，倒像是从肚子里发出来的。哭着哭着嗓子也哑了，连哭的力气也似乎耗尽了。"
      },
      {
        "id": "ko-44",

        "text": "见踢了也没有用，丈夫便扑到妻子的头边，抓住那真如喜鹊窝一般蓬乱的病人的头发摇晃着说：“你这娘们儿，说话啊，说话！嘴粘上了吗，你这个该死的娘们儿！”"

      {
        "id": "ko-51",
        "original": "이러다가 누운 이의 흰 창을 덮은, 위로 치뜬 눈을 알아보자마자, “이 눈깔! 이 눈깔! 왜 나를 바라보지 못하고 천정만 보느냐, 응.”하는 말 끝엔 목이 메었다. 그러자 산 사람의 눈에서 떨어진 닭의 똥 같은 눈물이 죽은 이의 뻣뻣한 얼굴을 어룽어룽 적시었다. 문득 김 첨지는 미칠 듯이 제 얼굴을 죽은 이의 얼굴에 한테 비비대며 중얼거렸다.",
        "text": "说着说着，他一认出躺着的人那双蒙着白翳、向上翻起的眼睛，便嚷道：“这双眼珠子！这双眼珠子！为什么不看着我，光看着天花板，嗯。”话说到最后，喉头便哽住了。于是，活人眼里落下的鸡屎般的泪水，一片片浸湿了死者僵硬的脸。忽然，金佥知像疯了似的，把自己的脸贴在死者脸上来回磨蹭，喃喃地说道。"

        "original": "“설렁탕을 사다놓았는데 왜 먹지를 못하니, 왜 먹지를 못하니... 괴상하게도 오늘은! 운수가 좋더니만...”",

    "paragraphs": [
      {
        "id": "ja-1",
        "original": "ある日の暮方の事である。一人の下人（げにん）が、羅生門（らしょうもん）の下で雨やみを待っていた。",
        "text": "某日傍晚的事。一个下人正在罗生门下等待雨停。"
      },
      {
        "id": "ja-2",
        "original": "広い門の下には、この男のほかに誰もいない。ただ、所々丹塗（にぬり）の剥（は）げた、大きな円柱（まるばしら）に、蟋蟀（きりぎりす）が一匹とまっている。羅生門が、朱雀大路（すざくおおじ）にある以上は、この男のほかにも、雨やみをする市女笠（いちめがさ）や揉烏帽子（もみえぼし）が、もう二三人はありそうなものである。それが、この男のほかには誰もいない。",
        "text": "宽阔的门下，除了这个男人之外没有别人。只有一只蟋蟀停在几处朱漆剥落的大圆柱上。罗生门既然位于朱雀大路上，按理说除了这个男人之外，应该还有两三个避雨的市女笠和揉乌帽子才是。然而，除了这个男人之外，竟无一人。"
      },
      {
        "id": "ja-3",
        "original": "何故かと云うと、この二三年、京都には、地震とか辻風（つじかぜ）とか火事とか饑饉とか云う災（わざわい）がつづいて起った。そこで洛中（らくちゅう）のさびれ方は一通りではない。旧記によると、仏像や仏具を打砕いて、その丹（に）がついたり、金銀の箔（はく）がついたりした木を、路ばたにつみ重ねて、薪（たきぎ）の料（しろ）に売っていたと云う事である。洛中がその始末であるから、羅生門の修理などは、元より誰も捨てて顧る者がなかった。するとその荒れ果てたのをよい事にして、狐狸（こり）が棲（す）む。盗人（ぬすびと）が棲む。とうとうしまいには、引取り手のない死人を、この門へ持って来て、棄てて行くと云う習慣さえ出来た。そこで、日の目が見えなくなると、誰でも気味を悪るがって、この門の近所へは足ぶみをしない事になってしまったのである。",
        "text": "要问为什么，这是因为这两三年来，京都接连发生了地震、辻风、火灾、饥馑之类的灾祸。于是洛中凋敝的程度非同寻常。据旧记记载，人们将佛像、佛具砸碎，把那些沾着朱丹、贴着金银箔的木料堆在路旁，当作柴火卖掉。洛中尚且如此，罗生门的修缮之类，自然更是无人理会。于是趁着这荒废破败，狐狸栖居其中，盗贼也栖居其中。到最后，甚至养成了这样的习惯：把无人认领的尸体抬到这座门来，丢弃而去。因此，天一黑，谁都感到阴森可怖，便不再走近这座门附近了。"
      },
      {
        "id": "ja-4",
        "original": "その代りまた鴉（からす）がどこからか、たくさん集って来た。昼間見ると、その鴉が何羽となく輪を描いて、高い鴟尾（しび）のまわりを啼きながら、飛びまわっている。ことに門の上の空が、夕焼けであかくなる時には、それが胡麻（ごま）をまいたようにはっきり見えた。鴉は、勿論、門の上にある死人の肉を、啄（ついば）みに来るのである。もっとも今日は、刻限（こくげん）が遅いせいか、一羽も見えない。ただ、所々、崩れかかった、そうしてその崩れ目に長い草のはえた石段の上に、鴉の糞（ふん）が、点々と白くこびりついているのが見える。下人は七段ある石段の一番上の段に、洗いざらした紺の襖（あお）の尻を据えて、右の頬に出来た、大きな面皰（にきび）を気にしながら、ぼんやり、雨のふるのを眺めていた。",
        "text": "与此相应，乌鸦也不知从何处成群结队地飞来。白天望去，那些乌鸦三五成群地画着圈，在高高的鸱尾周围啼叫着盘旋飞舞。尤其是门上方的天空被晚霞染红时，那些乌鸦就像撒了芝麻一样清晰可见。乌鸦当然是来啄食门上的死人肉的。不过今天也许是时辰已晚的缘故，一只也看不见。只看见到处坍塌的石阶上——那些坍塌的缝隙里长着长长的草——斑斑点点地粘着白色的鸦粪。仆役坐在七级石阶的最上一级，把洗得发白的藏青色袄子的下摆垫在身下，一边在意着右脸颊上长出的那颗大面疱，一边茫然地望着雨落下来。"

        "text": "作者方才写道：“仆役在等候雨停。”然而，即便雨停了，仆役也并无特别的去处。若在平时，当然应当回到主人家中。可偏偏四五天前，他已被那主人辞退了。如前所述，当时的京都城已是非同寻常地衰败了。这仆役长年受雇于主人，如今却被主人辞退，其实不过是这衰败泛起的一丝小小余波罢了。因此，与其说“仆役在等候雨停”，不如说“被雨困住的仆役无处可去，正一筹莫展”更为恰当。况且，今日的天色也不无影响地加重了这平安朝仆役的 Sentimentalisme。从申时下刻起下起的雨，至今仍无停歇的迹象。于是，仆役无论如何首先要设法应付明日的生计，换言之，就是要设法应付那无从着手的事，他一面循着漫无头绪的思绪，一面从方才起便似听非听地听着朱雀大路上雨的声音。"

        "text": "雨包裹着罗生门，从远处汇集来哗哗的声响。暮色渐渐压低天空，抬头望去，门楼屋顶那斜伸出去的瓦檐尖端，正沉沉地托着昏暗的云层。"

      {

        "text": "对于无可奈何的事，要想方设法去解决，就没有挑选手段的余裕了。若要挑选，便只会死在筑土墙下或路旁的泥土上，饿死而已。然后被搬到这门上来，像狗一样被丢弃罢了。若不挑选，仆人的想法在多少次徘徊于同一条路上之后，终于抵达了这个局部。然而这个“若”字，无论到什么时候，终究还是“若”字。仆人虽然肯定了不择手段这件事，但为了给这个“若”字做一个了结，对于随之而来的理所当然的“除了当强盗别无他法”这件事，却没有勇气积极地加以肯定。"

        "text": "仆人打了一个大喷嚏，然后吃力地站起身来。傍晚寒意袭人的京都，已经是想要火桶般的寒冷了。风从门柱与门柱之间，随着暮色毫不客气地吹透过去。停在朱漆柱子上的蟋蟀，也已经不知去向了。"

      {

      {

        "text": "此后，过了几分钟。在通往罗生门楼上的宽梯子中段，一个男人像猫一样蜷缩着身子，屏住呼吸，窥探着上面的情形。从楼上透下的火光，微微照亮了那男人的右脸颊。那是一张在短须中长着红肿化脓面疱的脸颊。下人一开始就估量着上面的人全是死人。然而当他爬上两三段梯子一看，上面似乎有人点着火，而且那火还在各处移动。这是因为那浑浊的黄色火光摇曳着映照在布满蜘蛛网的顶棚上，立刻就能辨认出来。在这样的雨夜，在这罗生门上点着火，想必绝非寻常之辈。"

      {

        "text": "下人像壁虎一样蹑手蹑脚，好不容易才顺着陡峭的梯子爬到最上面一级。然后尽量将身体放平，尽量将脖子向前伸，战战兢兢地向楼内窥视。"

        "original": "見ると、楼の内には、噂に聞いた通り、幾つかの死骸（しがい）が、無造作に棄ててあるが、火の光の及ぶ範囲が、思ったより狭いので、数は幾つともわからない。ただ、おぼろげながら、知れるのは、その中に裸の死骸と、着物を着た死骸とがあるという事である。勿論、中には女も男もまじっているらしい。そうして、その死骸は皆、それが、かつて、生きていた人間だと云う事実さえ疑われるほど、土を捏（こ）ねて造った人形のように、口を開（あ）いたり手を延ばしたりして、ごろごろ床の上にころがっていた。しかも、肩とか胸とかの高くなっている部分に、ぼんやりした火の光をうけて、低くなっている部分の影を一層暗くしながら、永久に唖（おし）の如く黙っていた。",
        "text": "一看，楼内正如传闻所说，几具尸体被随意丢弃着，但火光所及的范围比想象的要窄，所以数不清到底有几具。只是隐约能分辨出，其中有赤裸的尸体和穿着衣服的尸体。当然，其中似乎男女都有。而且那些尸体都像泥土捏成的人偶一样，张着嘴、伸着手，横七竖八地滚在床上，甚至让人怀疑它们曾经是活人的事实。而且，肩膀和胸口等较高的部位承受着朦胧的火光，使较低部位的阴影更加黑暗，永远像哑巴一样沉默着。"

        "text": "仆人不禁掩住了鼻子，那些尸骸腐烂的臭气实在太过刺鼻。然而下一刻，他的手便已经忘记了掩鼻——某种强烈的情绪几乎彻底夺走了这个男人的嗅觉。"

      {
        "id": "ja-14",
        "original": "下人の眼は、その時、はじめてその死骸の中に蹲（うずくま）っている人間を見た。檜皮色（ひわだいろ）の着物を着た、背の低い、痩（や）せた、白髪頭（しらがあたま）の、猿のような老婆である。その老婆は、右の手に火をともした松の木片（きぎれ）を持って、その死骸の一つの顔を覗きこむように眺めていた。髪の毛の長い所を見ると、多分女の死骸であろう。",
        "text": "这时，仆人的眼睛才第一次看见蹲在尸骸中间的人。那是一个穿着桧皮色衣裳、身材矮小、瘦削、满头白发、像猴子一样的老婆子。她右手举着一片点燃的松木片，正凑近一具尸骸的脸端详。从那长长的头发来看，大概是一具女尸。"
      },
      {
        "id": "ja-15",
        "original": "下人は、六分の恐怖と四分の好奇心とに動かされて、暫時（ざんじ）は呼吸（いき）をするのさえ忘れていた。旧記の記者の語を借りれば、「頭身（とうしん）の毛も太る」ように感じたのである。すると老婆は、松の木片を、床板の間に挿して、それから、今まで眺めていた死骸の首に両手をかけると、丁度、猿の親が猿の子の虱（しらみ）をとるように、その長い髪の毛を一本ずつ抜きはじめた。髪は手に従って抜けるらしい。",
        "text": "仆人被六分恐惧和四分好奇所驱使，一时间甚至忘记了呼吸。借用旧记记者的话来说，他感到“头身之毛亦竖”。只见老婆子将松木片插在地板缝里，然后双手按住方才端详的那具尸骸的头，恰似母猴替小猴捉虱子一般，开始一根一根地拔那长长的头发。头发似乎随手而落。"
      },
      {
        "id": "ja-16",
        "original": "その髪の毛が、一本ずつ抜けるのに従って、下人の心からは、恐怖が少しずつ消えて行った。そうして、それと同時に、この老婆に対するはげしい憎悪が、少しずつ動いて来た。いや、この老婆に対すると云っては、語弊（ごへい）があるかも知れない。むしろ、あらゆる悪に対する反感が、一分毎に強さを増して来たのである。この時、誰かがこの下人に、さっき門の下でこの男が考えていた、饑死（うえじに）をするか盗人（ぬすびと）になるかと云う問題を、改めて持出したら、恐らく下人は、何の未練もなく、饑死を選んだ事であろう。それほど、この男の悪を憎む心は、老婆の床に挿した松の木片（きぎれ）のように、勢いよく燃え上り出していたのである。",
        "text": "随着头发一根一根地被拔下，仆人心中的恐惧也一点一点地消退。与此同时，对这个老婆子的强烈憎恶则一点一点地涌动起来。不，说是对这个老婆子的憎恶，或许有语病。倒不如说，是对一切恶的反感，每一分钟都在增强。此时，倘若有人重新向这个仆人提起他方才在门楼下所想的那个问题——是饿死还是做盗贼——恐怕仆人会毫不犹豫地选择饿死。这个男子憎恶恶行的心，正如老婆子插在地板上的松木片一般，熊熊燃烧起来了。"
      },
      {
        "id": "ja-17",
        "original": "下人には、勿論、何故老婆が死人の髪の毛を抜くかわからなかった。従って、合理的には、それを善悪のいずれに片づけてよいか知らなかった。しかし下人にとっては、この雨の夜に、この羅生門の上で、死人の髪の毛を抜くと云う事が、それだけで既に許すべからざる悪であった。勿論、下人は、さっきまで自分が、盗人になる気でいた事なぞは、とうに忘れていたのである。",
        "text": "下人当然不明白这老婆子为何要拔死人的头发。因此，从常理上，他也无从判断此事该归之于善还是恶。然而对下人来说，在这雨夜之中，在这罗生门之上，拔死人头发这件事本身，便已是不容宽恕的恶。当然，下人早已忘了自己方才还打算当强盗的事。"
      },
      {
        "id": "ja-18",
        "original": "そこで、下人は、両足に力を入れて、いきなり、梯子から上へ飛び上った。そうして聖柄（ひじりづか）の太刀に手をかけながら、大股に老婆の前へ歩みよった。老婆が驚いたのは云うまでもない。",
        "text": "于是，下人双脚发力，猛地从梯子向上跃去。随即手按圣柄太刀，大步走向老婆子面前。老婆子吃了一惊自不待言。"
      },
      {
        "id": "ja-19",
        "original": "老婆は、一目下人を見ると、まるで弩（いしゆみ）にでも弾（はじ）かれたように、飛び上った。",
        "text": "老婆子一看见下人，便仿佛被弩弓弹射出去一般，跳了起来。"
      },
      {
        "id": "ja-20",
        "original": "「おのれ、どこへ行く。」",
        "text": "“你这贱人，往哪里跑。”"
      },
      {
        "id": "ja-21",
        "original": "下人は、老婆が死骸につまずきながら、慌てふためいて逃げようとする行手を塞（ふさ）いで、こう罵（ののし）った。老婆は、それでも下人をつきのけて行こうとする。下人はまた、それを行かすまいとして、押しもどす。二人は死骸の中で、しばらく、無言のまま、つかみ合った。しかし勝敗は、はじめからわかっている。下人はとうとう、老婆の腕をつかんで、無理にそこへねじ倒した。丁度、鶏（にわとり）の脚のような、骨と皮ばかりの腕である。",
        "text": "下人堵住了老婆子被尸体绊倒、惊慌失措欲逃的去路，如此骂道。老婆子仍想推开下人逃走。下人又不让她走，将她推了回去。两人在尸骸之间，一时无言地扭打在一起。然而胜负从一开始便已分明。下人终于抓住老婆子的手腕，强行将她拧倒在地。那正是一双如鸡脚般皮包骨头的胳膊。"
      },
      {
        "id": "ja-22",
        "original": "「何をしていた。云え。云わぬと、これだぞよ。」",
        "text": "「你在干什么。说。不说的话，就这个哦。」"
      },
      {
        "id": "ja-23",
        "original": "下人は、老婆をつき放すと、いきなり、太刀の鞘（さや）を払って、白い鋼（はがね）の色をその眼の前へつきつけた。けれども、老婆は黙っている。両手をわなわなふるわせて、肩で息を切らしながら、眼を、眼球（めだま）がまぶたの外へ出そうになるほど、見開いて、唖のように執拗（しゅうね）く黙っている。これを見ると、下人は始めて明白にこの老婆の生死が、全然、自分の意志に支配されていると云う事を意識した。そうしてこの意識は、今までけわしく燃えていた憎悪の心を、いつの間にか冷ましてしまった。後に残ったのは、ただ、ある仕事をして、それが円満に成就した時の、安らかな得意と満足とがあるばかりである。そこで、下人は、老婆を見下しながら、少し声を柔らげてこう云った。",
        "text": "下人把老太婆一把推开，随即唰地拔开太刀的刀鞘，将白亮亮的钢色逼到她眼前。然而老太婆却沉默不语。她两手抖抖索索，肩膀一耸一耸地喘着气，眼睛瞪得眼珠子几乎要蹦出眼皮外面，像哑巴一样执拗地沉默着。见此情形，下人这才清楚地意识到，这老太婆的生死完全掌握在自己的意志之中。而这一意识，不知何时竟把他此前一直猛烈燃烧着的憎恶之心冷却了。留下来的，只有做完一件工作、并且圆满成就时的那种安然的得意与满足。于是，下人俯视着老太婆，稍微放柔了声音这样说道。"
      },
      {
        "id": "ja-24",
        "original": "「己（おれ）は検非違使（けびいし）の庁の役人などではない。今し方この門の下を通りかかった旅の者だ。だからお前に縄（なわ）をかけて、どうしようと云うような事はない。ただ、今時分この門の上で、何をして居たのだか、それを己に話しさえすればいいのだ。」",
        "text": "「我不是检非违使厅的差役。只是方才路过这门下的一个旅人。所以不会拿绳子捆了你、要怎样处置你之类的事。只是，你这时候在这门楼上，究竟在干什么，只要把这事告诉我便好。」"
      },
      {
        "id": "ja-25",
        "original": "すると、老婆は、見開いていた眼を、一層大きくして、じっとその下人の顔を見守った。まぶたの赤くなった、肉食鳥のような、鋭い眼で見たのである。それから、皺で、ほとんど、鼻と一つになった唇を、何か物でも噛んでいるように動かした。細い喉で、尖った喉仏（のどぼとけ）の動いているのが見える。その時、その喉から、鴉（からす）の啼くような声が、喘（あえ）ぎ喘ぎ、下人の耳へ伝わって来た。",
        "text": "于是，老太婆把瞪着的眼睛睁得更大，目不转睛地盯住下人的脸看。是用那双眼皮泛红、像肉食鸟一般锐利的眼睛看的。接着，她那被皱纹挤得几乎和鼻子连成一体的嘴唇，像在嚼着什么东西似的动了起来。细瘦的喉咙里，可以看见尖尖的喉结在上下滚动。这时，从她那喉咙里，像乌鸦啼叫一般的声音，气喘吁吁地传到了下人的耳中。"
      },
      {
        "id": "ja-26",
        "original": "「この髪を抜いてな、この髪を抜いてな、鬘（かずら）にしようと思うたのじゃ。」",
        "text": "「把这头发拔下来，把这头发拔下来，我是想拿来做假发的啊。」"
      },
      {
        "id": "ja-27",
        "original": "下人は、老婆の答が存外、平凡なのに失望した。そうして失望すると同時に、また前の憎悪が、冷やかな侮蔑（ぶべつ）と一しょに、心の中へはいって来た。すると、その気色（けしき）が、先方へも通じたのであろう。老婆は、片手に、まだ死骸の頭から奪った長い抜け毛を持ったなり、蟇（ひき）のつぶやくような声で、口ごもりながら、こんな事を云った。",
        "text": "下人对于老婆子出乎意料的平凡回答感到失望。与此同时，先前的憎恶又连同冰冷的轻蔑一起涌上心头。而那种神色似乎也传达到了对方那里。老婆子一手仍攥着从死尸头上拔下的长发，发出蛤蟆嘟囔般的声音，吞吞吐吐地说了这样的话："
      },
      {
        "id": "ja-28",
        "original": "「成程な、死人（しびと）の髪の毛を抜くと云う事は、何ぼう悪い事かも知れぬ。じゃが、ここにいる死人どもは、皆、そのくらいな事を、されてもいい人間ばかりだぞよ。現在、わしが今、髪を抜いた女などはな、蛇を四寸（しすん）ばかりずつに切って干したのを、干魚（ほしうお）だと云うて、太刀帯（たてわき）の陣へ売りに往（い）んだわ。疫病（えやみ）にかかって死ななんだら、今でも売りに往んでいた事であろ。それもよ、この女の売る干魚は、味がよいと云うて、太刀帯どもが、欠かさず菜料（さいりよう）に買っていたそうな。わしは、この女のした事が悪いとは思うていぬ。せねば、饑死をするのじゃて、仕方がなくした事であろ。されば、今また、わしのしていた事も悪い事とは思わぬぞよ。これとてもやはりせねば、饑死をするじゃて、仕方がなくする事じゃわいの。じゃて、その仕方がない事を、よく知っていたこの女は、大方わしのする事も大目に見てくれるであろ。」",
        "text": "「的确，拔死人的头发，不知道是多么坏的事。可是，这里的死人，全都是活该被这样对待的人哪。现在，我刚刚拔了头发的那个女人，是把蛇切成四寸来长晒干，说是干鱼，拿到带刀侍卫的营地去卖的。要不是染上瘟疫死了，现在也还会去卖的吧。还有啊，这女人卖的干鱼，据说味道不错，带刀侍卫们从不间断地买来当菜料哪。我不觉得这女人做的事是坏事。不这么做，就要饿死嘛，是没办法才做的事吧。所以，现在我又做的事，也不觉得是坏事呀。这也是不这么做的话，同样要饿死，是没办法才做的事嘛。所以，很明白这种没办法的事的这个女人，大概也会宽恕我做的事吧。」"
      },
      {
        "id": "ja-29",
        "original": "老婆は、大体こんな意味の事を云った。",
        "text": "老婆大体说了这样一番意思的话。"
      },
      {
        "id": "ja-30",
        "original": "下人は、太刀を鞘（さや）におさめて、その太刀の柄（つか）を左の手でおさえながら、冷然として、この話を聞いていた。勿論、右の手では、赤く頬に膿を持った大きな面皰（にきび）を気にしながら、聞いているのである。しかし、これを聞いている中に、下人の心には、ある勇気が生まれて来た。それは、さっき門の下で、この男には欠けていた勇気である。そうして、またさっきこの門の上へ上って、この老婆を捕えた時の勇気とは、全然、反対な方向に動こうとする勇気である。下人は、饑死をするか盗人になるかに、迷わなかったばかりではない。その時のこの男の心もちから云えば、饑死などと云う事は、ほとんど、考える事さえ出来ないほど、意識の外に追い出されていた。",
        "text": "下人把太刀插回鞘中，左手按着刀柄，冷冷地听着这番话。当然，他右手还在意着自己脸颊上那颗红肿化脓的大面疱，一边听着。然而，听着听着，下人的心中渐渐生出了一股勇气。那是方才在门楼下，这个男人所欠缺的勇气。而且，这勇气与方才爬上这道门楼、抓住这个老婆子时的勇气，方向全然相反。下人不再犹豫是饿死还是当盗贼了。若从他此刻的心境来说，饿死之类的事，几乎连想都不曾想过，已被逐出了意识之外。"
      },
      {
        "id": "ja-31",
        "original": "「きっと、そうか。」",
        "text": "“一定就是这样吧。”"
      },
      {
        "id": "ja-32",
        "original": "老婆の話が完（おわ）ると、下人は嘲（あざけ）るような声で念を押した。そうして、一足前へ出ると、不意に右の手を面皰（にきび）から離して、老婆の襟上（えりがみ）をつかみながら、噛みつくようにこう云った。",
        "text": "老婆子的话一说完，下人便用嘲弄的声音叮问了一句。随即向前迈了一步，猛然把右手从面疱上移开，一把揪住老婆子的衣领，像咬人似的说道："
      },
      {
        "id": "ja-33",
        "original": "「では、己（おれ）が引剥（ひはぎ）をしようと恨むまいな。己もそうしなければ、饑死をする体なのだ。」",
        "text": "“那么，我剥你的衣裳，你可别怨恨。我也是不这么做，就得饿死的人。”"
      },
      {
        "id": "ja-34",
        "original": "下人は、すばやく、老婆の着物を剥ぎとった。それから、足にしがみつこうとする老婆を、手荒く死骸の上へ蹴倒した。梯子の口までは、僅に五歩を数えるばかりである。下人は、剥ぎとった檜皮色（ひわだいろ）の着物をわきにかかえて、またたく間に急な梯子を夜の底へかけ下りた。",
        "text": "下人迅速剥下了老婆子的衣裳。接着，把抱住他腿的老婆子狠狠一脚踢倒在死尸上。到梯口不过五步远。下人把剥下的桧皮色衣裳夹在腋下，转眼之间便顺着陡峭的梯子溜进了夜的深渊。"
      },
      {
        "id": "ja-35",
        "original": "しばらく、死んだように倒れていた老婆が、死骸の中から、その裸の体を起したのは、それから間もなくの事である。老婆はつぶやくような、うめくような声を立てながら、まだ燃えている火の光をたよりに、梯子の口まで、這って行った。そうして、そこから、短い白髪（しらが）を倒（さかさま）にして、門の下を覗きこんだ。外には、ただ、黒洞々（こくとうとう）たる夜があるばかりである。",
        "text": "过了一会儿，像死了一样倒着的老婆子，从死尸中抬起那赤裸的身体，是那之后不久的事。老婆子发出像嘟囔、像呻吟般的声音，借着还在燃烧的火光，爬到梯子口。然后，从那里把短短的白发倒垂下来，窥视门下。外面只有黑漆漆的夜而已。"
      },
      {
        "id": "ja-36",
        "original": "下人の行方（ゆくえ）は、誰も知らない。",
        "text": "下人的去向，无人知晓。"
      }
    ],

        "body": "“市女笠”和“揉乌帽子”是两种旧时的帽子。在这句话里，它们也借代戴帽子的过路人，就像我们说“门口来了几个白大褂”，实际指的是穿白大褂的人。\n\n罗生门位于朱雀大路，本应有人经过，下雨时也该有两三个人来躲雨。作者却说，除了下人之外竟无一人。下一段才解释：京都接连遭灾，城门荒废，甚至成了弃置尸体的地方。\n\n因此，这两种帽子不必逐一想得很复杂；它们先让读者想到普通行人的身影，再用这些身影的缺席，显出城市的冷清和衰败。",

function profileField(f){const v=current.pre?.[f.id]??'',typeTag=f.group==='personal'?'':`<span class="profile-type-tag">${f.type==='multi'?'多选':'单选'}</span>`,label=`${clean(f.label)} ${typeTag}<span class="required-mark" aria-hidden="true">*</span>`;if(f.type==='multi'){const values=Array.isArray(v)?v:[];return `<fieldset class="field profile-multi" id="pre-${f.id}" tabindex="-1" aria-required="true"><legend>${label}</legend><div class="profile-options">${f.options.map((option,i)=>`<label class="profile-option" for="pre-${f.id}-${i}"><input type="checkbox" id="pre-${f.id}-${i}" name="pre-${f.id}" value="${clean(option)}" ${values.includes(option)?'checked':''}><span>${clean(option)}</span></label>`).join('')}</div>${profileOtherMarkup(f,values)}</fieldset>`}return `<div class="field"><label for="pre-${f.id}">${label}</label>${f.type==='age'?`<input id="pre-age" type="number" min="1" max="120" step="1" inputmode="numeric" required aria-required="true" placeholder="请输入年龄" value="${clean(v)}">`:`<select id="pre-${f.id}" required aria-required="true"><option value="">请选择</option>${f.options.map(option=>`<option value="${clean(option)}" ${v===option?'selected':''}>${clean(option)}</option>`).join('')}</select>`}${profileOtherMarkup(f,v)}</div>`}

function seatOccupancy(snapshot=load()){return Array.from({length:48},(_,i)=>{const id='P'+String(i+1).padStart(3,'0'),session=snapshot.sessions[id],claimRaw=localStorage.getItem(CLAIM_PREFIX+id);let claim;try{claim=JSON.parse(claimRaw||'null')}catch{claim=null}const occupied=!!session||!!claimRaw,task=session?.tasks?.find(t=>['reading','survey','ux'].includes(t.status)),completed=session?.tasks?.filter(t=>t.status==='done').length||0;let status='可选择';if(occupied){status=!session?'已领取（尚无实验记录）':session.status==='completed'?'已完成':!session.consentAt?'填写基本信息':session.status==='comparison'?'填写最终问卷':task?.status==='reading'?'正在阅读':task?.status==='survey'?'填写读后问卷':task?.status==='ux'?'填写体验问卷':'等待开始阅读'}return {id,occupied,status,session,claimRaw,claimedAt:claim?.claimedAt||session?.createdAt||null,completed,round:task?.index||null}})}
function seatReleaseSignature(id,snapshot=load()){const session=snapshot.sessions[id];return JSON.stringify({generation:snapshot.meta.slotGenerations?.[id]||'initial',instanceId:session?.instanceId||'',createdAt:session?.createdAt||'',claim:localStorage.getItem(CLAIM_PREFIX+id)})}
function openSeatAdmin(){if(!adminUnlocked){requestAdminAccess();return false}db=load();seatFilter='all';view='seatAdmin';render();return true}
function pageSeatAdmin(){if(!adminUnlocked)return adminLockedMarkup();const rows=seatOccupancy(),occupied=rows.filter(x=>x.occupied).length,shown=rows.filter(x=>seatFilter==='all'||(seatFilter==='occupied'?x.occupied:!x.occupied));return `<div class="library-wrap"><div class="admin-parent-bar"><button class="btn" type="button" id="seat-admin-parent" aria-label="返回上一级：研究者数据报告">← 返回上一级</button><span>研究者数据报告 / 管理实验编号</span></div><div class="eyebrow">管理员工具</div><h1>实验编号管理</h1><p class="lead">查看全部编号的使用情况；释放已占用编号后，新参与者可以重新选择。</p><div class="seat-admin-toolbar"><label for="seat-admin-filter">显示编号</label><select id="seat-admin-filter"><option value="all" ${seatFilter==='all'?'selected':''}>全部编号（48）</option><option value="occupied" ${seatFilter==='occupied'?'selected':''}>已占用（${occupied}）</option><option value="available" ${seatFilter==='available'?'selected':''}>可选择（${48-occupied}）</option></select><button type="button" class="btn tiny" id="seat-admin-refresh">刷新状态</button><span class="small muted">已占用 ${occupied} / 48 · 可选择 ${48-occupied} / 48</span></div><div class="seat-admin-grid">${shown.map(row=>`<article class="seat-admin-card ${row.occupied?'occupied':'available'}"><div class="flex between gap8"><h2>${row.id}</h2><span class="chip ${row.occupied?'gold':''}">${row.occupied?'已占用':'可选择'}</span></div><p class="seat-admin-status">${row.status}</p><p class="small muted">${row.occupied?`领取时间：${pretty(row.claimedAt)}<br>${row.session?`已完成 ${row.completed} / 3 轮${row.round?` · 当前第 ${row.round} 轮`:''}`:'可释放此编号后重新领取'}`:'尚未被选择'}</p><div class="seat-admin-actions">${row.session?`<button type="button" class="btn tiny" data-seat-report="${row.id}">查看记录</button>`:''}${row.occupied?`<button type="button" class="btn danger tiny" data-seat-release="${row.id}">释放编号</button>`:''}</div></article>`).join('')||'<p class="muted">没有符合条件的编号。</p>'}</div><div class="mt22"><button type="button" class="btn" id="seat-admin-back">返回研究者数据报告</button></div></div>`}
function requestSeatRelease(id){if(!adminUnlocked||!/^P(?:00[1-9]|0[1-3]\d|04[0-8])$/.test(id))return false;const row=seatOccupancy().find(x=>x.id===id);if(!row?.occupied)return false;pendingSeatRelease={id,signature:seatReleaseSignature(id)};$('seat-release-code').textContent=id;$('seat-release-summary').textContent=row.status+(row.session?` · 已完成 ${row.completed} / 3 轮`:'');$('seat-release-check').checked=false;$('seat-release-confirm').disabled=true;$('seat-release-error').textContent='';$('seat-release-dialog').showModal();return true}

function clearReleasedReferences(id){if(activeReaderAI?.record.sessionId===id){activeReaderAI.controller.abort();activeReaderAI=null}if(readerAIRecord?.sessionId===id){readerAIRecord=null;readerAIVisible=false}if(pendingReading?.sessionId===id){pendingReading=null;$('reading-intro').close()}if(current?.id===id)current=null;if(adminPreviewOriginal?.current?.id===id)adminPreviewOriginal.current=null;if(previewNavigation?.original?.id===id)previewNavigation=null;if(window.reportID===id)window.reportID=null;if(sessionStorage.getItem(STORAGE+'_active')===id)sessionStorage.removeItem(STORAGE+'_active')}
async function releaseSeat(id,expectedSignature){if(!adminUnlocked)return {ok:false,error:'需要管理员权限。'};if(!/^P(?:00[1-9]|0[1-3]\d|04[0-8])$/.test(id))return {ok:false,error:'无效的实验编号。'};const action=()=>{if(!adminUnlocked)return {ok:false,error:'需要管理员权限。'};const fresh=load();if(!seatOccupancy(fresh).find(x=>x.id===id)?.occupied)return {ok:false,error:'这个编号已经可选择，请刷新状态。'};if(!expectedSignature||seatReleaseSignature(id,fresh)!==expectedSignature)return {ok:false,error:'编号占用情况已变化，请刷新后重新确认。'};const nextGeneration=uid();fresh.meta.slotGenerations??={};fresh.meta.slotGenerations[id]=nextGeneration;fresh.meta.seatReleaseEvents??=[];fresh.meta.seatReleaseEvents.push({id:uid(),at:now(),seat:id,hadRecord:!!fresh.sessions[id],hadClaim:!!localStorage.getItem(CLAIM_PREFIX+id)});delete fresh.sessions[id];try{localStorage.setItem(STORAGE,JSON.stringify(fresh));localStorage.removeItem(CLAIM_PREFIX+id)}catch{return {ok:false,error:'释放失败，请检查本机存储后刷新重试。'}}db=fresh;clearReleasedReferences(id);return {ok:true,id}};return navigator.locks?.request?await navigator.locks.request(STORAGE+'_claim',action):action()}
async function confirmSeatRelease(){if(seatReleaseBusy||!pendingSeatRelease||!$('seat-release-check').checked)return false;const pending=pendingSeatRelease;seatReleaseBusy=true;$('seat-release-confirm').disabled=true;try{const result=await releaseSeat(pending.id,pending.signature);if(!result.ok){$('seat-release-error').textContent=result.error;return false}pendingSeatRelease=null;$('seat-release-dialog').close();view='seatAdmin';render();notice(pending.id+' 的旧实验结果已删除，编号已释放。');return true}catch{$('seat-release-error').textContent='释放失败，请刷新后重试。';return false}finally{seatReleaseBusy=false;if(pendingSeatRelease)$('seat-release-confirm').disabled=!$('seat-release-check').checked}}
function discardReleasedSession(){const latest=load();if(!current||validSessionGeneration(current,latest.meta))return false;const id=current.id;clearReleasedReferences(id);db=latest;mode='study';selectedCode=null;view='entry';render();notice('当前编号已由管理员释放，请重新选择编号。');return true}
function handleStorageUpdate(event){if(event.key!==STORAGE&&!event.key?.startsWith(CLAIM_PREFIX))return;if(discardReleasedSession())return;if(['entry','reports','seatAdmin','studyStatistics'].includes(view)){db=load();render()}}
function attachSeatAdmin(){const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};on('seat-admin-refresh',()=>{db=load();render()});on('seat-admin-back',openAdminReports);on('seat-admin-parent',openAdminReports);const filter=$('seat-admin-filter');if(filter)filter.onchange=e=>{seatFilter=e.target.value;render()};document.querySelectorAll('[data-seat-release]').forEach(el=>el.onclick=()=>requestSeatRelease(el.dataset.seatRelease));document.querySelectorAll('[data-seat-report]').forEach(el=>el.onclick=()=>renderParticipant(el.dataset.seatReport))}

const COMPREHENSION_KEY_VERSION='culture-standard-key-v1';
const COMPREHENSION_QUESTIONNAIRE_VERSIONS=['culture-inference-5-draft-v2','culture-inference-5-v3'];
function scoreComprehension(task){
 const material=MATERIALS[task.material],survey=task.survey,base={keyVersion:COMPREHENSION_KEY_VERSION,material:task.material,maxScore:material?.questions.length||5,score:null,answered:0,items:[],status:'not_submitted'};
 if(!material)return {...base,status:'unknown_material'};
 if(!survey?.submittedAt)return base;
 if(survey.questionnaireVersion&&!COMPREHENSION_QUESTIONNAIRE_VERSIONS.includes(survey.questionnaireVersion))return {...base,status:'incompatible_questionnaire'};
 const items=material.questions.map(q=>{const raw=survey[q.id],selected=Number.isInteger(raw)&&raw>=0&&raw<q.options.length?raw:null;return {questionId:q.id,selectedAnswer:selected,correctAnswer:q.key,correct:selected===null?null:selected===q.key,points:selected===null?null:Number(selected===q.key),maxPoints:1,evidenceParagraphIds:[...q.evidenceParagraphIds],rationale:q.rationale}}),answered=items.filter(i=>i.selectedAnswer!==null).length;

}
function comprehensionSummary(session){const grades=session.tasks.map(scoreComprehension).filter(g=>g.status==='scored'),plannedTasks=session.mode==='study'?3:session.tasks.length;return {score:grades.length?grades.reduce((sum,g)=>sum+g.score,0):null,maxScore:grades.reduce((sum,g)=>sum+g.maxScore,0),plannedMax:plannedTasks*5,gradedTasks:grades.length,plannedTasks,complete:grades.length===plannedTasks&&plannedTasks>0}}
function scoredSession(session){const copy=JSON.parse(JSON.stringify(session));copy.comprehensionSummary=comprehensionSummary(session);if(copy.postStudy?.modeDescriptions)copy.postStudy.modeDescriptions={...MODE_DESCRIPTIONS};for(const task of copy.tasks){for(const ack of task.readingIntroAcknowledgements||[])if(Object.hasOwn(MODE_DESCRIPTIONS,ack.condition))ack.label=tag(ack.condition);for(const event of task.events||[])if(event.type==='READING_INTRO_CONFIRM'&&event.payload?.label&&Object.hasOwn(MODE_DESCRIPTIONS,event.payload.condition))event.payload.label=tag(event.payload.condition);const grade=scoreComprehension(task);task.comprehensionScore=grade;if(grade.status!=='scored')continue;if(task.survey.answerKeyVersion!==COMPREHENSION_KEY_VERSION){task.survey.previousScoring={culturalScore:task.survey.culturalScore??null,maxScore:task.survey.maxScore??null,scoringStatus:task.survey.scoringStatus||'',questionnaireVersion:task.survey.questionnaireVersion||''}}Object.assign(task.survey,{culturalScore:grade.score,maxScore:grade.maxScore,scoringStatus:'standard_key',answerKeyVersion:grade.keyVersion,questionResults:grade.items})}return copy}
function comprehensionRows(session,task){const g=scoreComprehension(task);return g.items.map(item=>({participant:session.id,attempt:task.id,round:task.index,material:task.material,condition:task.condition,question_id:item.questionId,selected_index:item.selectedAnswer??'',selected_option:item.selectedAnswer===null?'':String.fromCharCode(65+item.selectedAnswer),correct_index:item.correctAnswer,correct_option:String.fromCharCode(65+item.correctAnswer),correct:item.correct??'',points:item.points??'',max_points:1,task_score:g.score??'',task_max:g.maxScore,scoring_status:g.status,answer_key_version:g.keyVersion,evidence_paragraphs:item.evidenceParagraphIds.join('|')}))}
function comprehensionStatistics(input){
 const sessions=input.filter(s=>s.mode==='study'&&s.consentAt),full=sessions.map(comprehensionSummary).filter(s=>s.complete);
 const materials=Object.values(MATERIALS).map(m=>{const values=sessions.map(s=>s.tasks.filter(t=>t.material===m.id).map(scoreComprehension).filter(g=>g.status==='scored')).filter(gs=>gs.length).map(gs=>gs.reduce((sum,g)=>sum+g.score,0)/gs.length);return {id:m.id,label:m.title,max:5,...meanSD(values)}});

function comprehensionKeyMarkup(){return `<details class="mt22"><summary>查看标准答案与文本依据（管理员）</summary>${Object.values(MATERIALS).map(m=>`<section class="answer-key-material"><h3>${clean(m.title)}</h3>${m.questions.map((q,i)=>`<p class="small"><strong>第 ${i+1} 题：${String.fromCharCode(65+q.key)}. ${clean(q.options[q.key])}</strong><br>${clean(q.rationale)}<br><span class="muted">文本依据：${clean(q.evidenceParagraphIds.join('、'))}</span></p>`).join('')}</section>`).join('')}</details>`}

let statisticsAICondition='all',statisticsAIKind='all',statisticsAIQuote='',statisticsAIPage=1,statisticsAIDetailsOpen=false;
const READING_ITEM_NAMES={effort:'心智努力',flow:'阅读连贯性',agency:'自主判断',informationLoad:'信息负担',engagement:'持续投入'};
function statisticsSessions(){return buildStudyStatistics().sessions}
function recordStatusLabel(value){return ({done:'已完成',failed:'失败／中断',cancelled:'已停止',running:'生成中',completed:'已完成',comparison:'最终比较',consent:'基本信息',running_study:'进行中'})[value]||value||'未记录'}
function statisticsRecordButton(id){return `<button type="button" class="btn tiny" data-stat-participant="${clean(id)}">查看个体报告</button>`}
function sessionResearchStage(session){if(session.status==='completed')return '已完成';if(session.status==='comparison')return '最终比较';const task=session.tasks.find(t=>['reading','survey','ux'].includes(t.status));return task?({reading:'阅读中',survey:'读后问卷',ux:'SUS / UEQ'})[task.status]:session.consentAt?'待开始下一轮':'基本信息'}
function studyProgress(sessions){const tasks=sessions.flatMap(s=>s.tasks),stages=['待开始下一轮','阅读中','读后问卷','SUS / UEQ','最终比较','已完成'].map(label=>({label,n:sessions.filter(s=>sessionResearchStage(s)===label).length}));const conditions=CONDITIONS.map(condition=>{const items=tasks.filter(t=>t.condition===condition);return {condition,planned:items.length,started:items.filter(t=>t.reading).length,ended:items.filter(t=>t.reading?.endAt).length,contentSubmitted:items.filter(t=>t.survey?.submittedAt).length,contentScored:items.filter(t=>scoreComprehension(t).status==='scored').length,experienceValid:items.filter(t=>t.survey?.submittedAt&&READING_ITEMS.every(i=>Number.isInteger(t.survey[i.id])&&t.survey[i.id]>=1&&t.survey[i.id]<=i.max)).length,uxSubmitted:items.filter(t=>t.ux?.submittedAt).length,uxValid:items.filter(t=>rawUXSummary(t).sus!==null&&rawUXSummary(t).ueq!==null).length,done:items.filter(t=>t.status==='done').length}});const issues=[];for(const s of sessions){for(const t of s.tasks){const messages=[],g=scoreComprehension(t);if(t.survey?.submittedAt&&g.status!=='scored')messages.push(g.status==='incompatible_questionnaire'?'理解题版本不兼容':'理解题原始选择不完整');if(t.survey?.submittedAt&&!READING_ITEMS.every(i=>Number.isInteger(t.survey[i.id])&&t.survey[i.id]>=1&&t.survey[i.id]<=i.max))messages.push('阅读体验原始答案不完整或超出量尺');if(t.ux?.submittedAt&&(rawUXSummary(t).sus===null||rawUXSummary(t).ueq===null))messages.push('SUS / UEQ 原始答案不完整或超出量尺');if(t.status==='done'&&(!t.survey?.submittedAt||!t.ux?.submittedAt))messages.push('任务已完成但缺少问卷提交记录');if(t.reading?.endAt&&(numberOrNull(t.reading.visibleMs,0)===null||numberOrNull(t.reading.wallSeconds,0)===null))messages.push('阅读已结束但计时字段缺失');if(messages.length)issues.push({participant:s.id,round:t.index,material:t.material,condition:t.condition,messages})}if(s.status==='completed'&&!s.postStudy?.submittedAt)issues.push({participant:s.id,round:'—',material:'',condition:'',messages:['实验已完成但缺少最终比较问卷']})}return {stages,conditions,issues,completionTimes:meanSD(sessions.filter(s=>s.status==='completed').map(s=>{const start=Date.parse(s.consentAt),end=Date.parse(s.completedAt);return Number.isFinite(start)&&Number.isFinite(end)&&end>=start?(end-start)/60000:null}))}}
function progressPanel(stats){const data=studyProgress(stats.sessions);return `<section class="card mt22" id="statistics-progress"><h2 class="section-title">完成进度与数据完整性</h2><div class="stat-chip-row">${data.stages.map(s=>`<span class="chip">${s.label} ${s.n} 人</span>`).join('')}</div><p class="small muted">完整实验用时 Mean（SD）：${statNumber(data.completionTimes.mean)}（${statNumber(data.completionTimes.sd)}）分钟 · N = ${data.completionTimes.n}。按同意参与至最后提交计算，包含中断时间。</p><div class="scroll-x"><table class="report-table"><thead><tr><th>阅读条件</th><th>计划任务</th><th>开始 / 结束阅读</th><th>理解题可评分 / 已提交</th><th>阅读体验有效</th><th>量表有效 / 已提交</th><th>完成本轮</th></tr></thead><tbody>${data.conditions.map(c=>`<tr><td>${clean(tag(c.condition))}</td><td>${c.planned}</td><td>${c.started} / ${c.ended}</td><td>${c.contentScored} / ${c.contentSubmitted}</td><td>${c.experienceValid}</td><td>${c.uxValid} / ${c.uxSubmitted}</td><td>${c.done}</td></tr>`).join('')}</tbody></table></div><details class="mt22"><summary>需要核查的记录 · ${data.issues.length} 项</summary><p class="small muted">列出缺失或不一致字段，便于人工核查，不据此自动剔除参与者。尚未提交的草稿不视为异常。</p>${data.issues.length?`<div class="scroll-x"><table class="report-table"><thead><tr><th>用户编号</th><th>任务</th><th>需核查内容</th><th>操作</th></tr></thead><tbody>${data.issues.map(i=>`<tr><td>${clean(i.participant)}</td><td>${i.round==='—'?'最终比较':`第 ${i.round} 轮 · ${clean(MATERIALS[i.material]?.title||i.material)}`}</td><td>${clean(i.messages.join('；'))}</td><td>${statisticsRecordButton(i.participant)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small muted">当前范围内未发现上述字段缺失。</p>'}</details></section>`}
function culturalItemStatistics(sessions){return Object.values(MATERIALS).map(material=>{const grades=sessions.flatMap(s=>s.tasks.filter(t=>t.material===material.id).map(t=>({participant:s.id,grade:scoreComprehension(t)}))).filter(x=>x.grade.status==='scored');return {material:material.id,title:material.title,rows:material.questions.map((q,index)=>{const perPerson=new Map();for(const row of grades){if(!perPerson.has(row.participant))perPerson.set(row.participant,[]);perPerson.get(row.participant).push(row.grade.items[index])}const points=[...perPerson.values()].map(items=>items.reduce((a,i)=>a+i.points,0)/items.length),options=q.options.map((_,i)=>({option:String.fromCharCode(65+i),count:grades.filter(g=>g.grade.items[index].selectedAnswer===i).length}));return {id:q.id,index:index+1,prompt:q.q,correctOption:String.fromCharCode(65+q.key),...meanSD(points),correctTasks:grades.filter(g=>g.grade.items[index].correct).length,taskN:grades.length,options}})}})}
function cultureItemsPanel(sessions){return `<details class="mt22"><summary>理解题逐题正确率与选项分布（15 题）</summary><p class="small muted">正确率按完整可评分的问卷计算；选择分布为作答次数。重复任务先在同一用户内平均后计入均值。标准答案仅在管理员区域展示。</p>${culturalItemStatistics(sessions).map(m=>`<h3>${clean(m.title)}</h3><div class="scroll-x"><table class="report-table statistics-table"><thead><tr><th>理解题</th><th>标准答案</th><th>正确率</th><th>SD（0/1分）</th><th>有效人数 N</th><th>选项分布</th></tr></thead><tbody>${m.rows.map(r=>`<tr><td>${r.index}. ${clean(r.prompt)}</td><td>${r.correctOption}</td><td>${r.mean===null?'—':statNumber(r.mean*100)+'%'}</td><td>${statNumber(r.sd)}</td><td>${r.n}</td><td>${r.options.map(o=>o.option+'：'+o.count).join(' · ')}</td></tr>`).join('')}</tbody></table></div>`).join('')}</details>`}
function readingExperienceValue(task,item){const value=task.survey?.[item.id];return task.survey?.submittedAt&&Number.isInteger(value)&&value>=1&&value<=item.max?value:null}

function readingExperiencePanel(sessions){return `<section class="card mt22" id="statistics-reading-experience"><h2 class="section-title">阅读体验 · 五项自评得分</h2><p class="small muted">心智努力满分 9 分，其余各项满分 7 分。每项分别展示 Mean / 满分、样本 SD、N，不把方向不同的项目相加成总分。心智努力和信息负担越高表示投入或负担越大。</p>${readingExperienceGroups(sessions).map(g=>`<h3>${clean(g.label)}</h3>${statsTable(g.rows)}`).join('')}<details class="mt22"><summary>按作品查看阅读体验</summary>${readingExperienceMaterialGroups(sessions).map(g=>`<h3>${clean(g.label)}</h3>${statsTable(g.rows)}`).join('')}</details></section>`}
function aiSelectionStatistics(sessions,filters={}){const all=sessions.flatMap(s=>s.tasks.flatMap(t=>readerAIReportRows(s,t))),records=all.filter(r=>(!filters.condition||filters.condition==='all'||r.condition===filters.condition)&&(!filters.kind||filters.kind==='all'||r.kind===filters.kind)&&(!filters.quote||String(r.quote||'').includes(filters.quote))),words=new Map();for(const r of records){const quote=String(r.quote||'').trim().replace(/\s+/g,' ');if(!quote)continue;const key=JSON.stringify([r.material,r.language,quote]);if(!words.has(key))words.set(key,{quote,material:r.material,language:r.language,count:0,participants:new Set(),explain:0,search:0,done:0,failed:0,cancelled:0,retries:0});const row=words.get(key);row.count++;row.participants.add(r.participant);if(['explain','search'].includes(r.kind))row[r.kind]++;if(['done','failed','cancelled'].includes(r.status))row[r.status]++;if(r.retry_of)row.retries++}const frequency=[...words.values()].map(w=>({...w,participantCount:w.participants.size,participants:[...w.participants].sort()})).sort((a,b)=>b.count-a.count||a.material.localeCompare(b.material)||a.quote.localeCompare(b.quote));return {records,frequency,total:records.length,users:new Set(records.map(r=>r.participant)).size,initial:records.filter(r=>!r.retry_of).length,retries:records.filter(r=>r.retry_of).length,missingQuotes:records.filter(r=>!String(r.quote||'').trim()).length,states:Object.fromEntries(['done','failed','cancelled','running'].map(status=>[status,records.filter(r=>r.status===status).length])),unknownStatus:records.filter(r=>!['done','failed','cancelled','running'].includes(r.status)).length,byCondition:CONDITIONS.map(condition=>{const rs=records.filter(r=>r.condition===condition);return {condition,calls:rs.length,users:new Set(rs.map(r=>r.participant)).size,explain:rs.filter(r=>r.kind==='explain').length,search:rs.filter(r=>r.kind==='search').length,done:rs.filter(r=>r.status==='done').length,failed:rs.filter(r=>r.status==='failed').length}})}}
function aiParagraphLabels(value){try{const ids=JSON.parse(value);return Array.isArray(ids)?ids.filter(id=>typeof id==='string').join('、')||'未记录':'未记录'}catch{return '未记录'}}

" id="statistics-ai-calls-export">导出当前 AI 调用明细 CSV</button></div><h3>按条件的调用情况</h3><div class="scroll-x"><table class="report-table"><thead><tr><th>条件</th><th>次数</th><th>人数</th><th>解释 / 检索</th><th>完成 / 失败</th></tr></thead><tbody>${data.byCondition.map(c=>`<tr><td>${clean(tag(c.condition))}</td><td>${c.calls}</td><td>${c.users}</td><td>${c.explain} / ${c.search}</td><td>${c.done} / ${c.failed}</td></tr>`).join('')}</tbody></table></div><h3>具体选词与次数</h3><div class="scroll-x statistics-words"><table class="report-table"><thead><tr><th>选中词句</th><th>作品 / 语言</th><th>调用次数</th><th>人数</th><th>解释 / 检索</th><th>重试次数</th><th>用户编号</th></tr></thead><tbody>${data.frequency.map(w=>`<tr><td class="statistics-quote">${clean(w.quote)}</td><td>${clean(MATERIALS[w.material]?.title||w.material)}<br>${w.language==='original'?'原文':w.language==='translation'?'中文译文':'语言未记录'}</td><td>${w.count}</td><td>${w.participantCount}</td><td>${w.explain} / ${w.search}</td><td>${w.retries}</td><td>${clean(w.participants.join('、'))}</td></tr>`).join('')||'<tr><td colspan="7">当前范围没有选词 AI 记录。</td></tr>'}</tbody></table></div><details class="mt22" id="statistics-ai-details" ${statisticsAIDetailsOpen?'open':''}><summary>每次调用的阶段与具体解释 · ${data.total} 条</summary><p class="small muted">保留失败与停止记录。旧记录缺少调用时间或阶段时明确标记，不推断补填。</p><div class="statistics-ai-pagination"><button type="button" class="btn tiny" id="statistics-ai-prev" ${page===1?'disabled':''}>上一页</button><span>第 ${page} / ${pages} 页 · 每页 15 条</span><button type="button" class="btn tiny" id="statistics-ai-next" ${page===pages?'disabled':''}>下一页</button></div>${records.map(r=>`<article class="statistics-ai-record"><h4>${clean(r.participant)} · 第 ${r.round} 轮 · ${clean(MATERIALS[r.material]?.title||r.material)} · ${clean(tag(r.condition))}</h4><p class="small muted">${r.kind==='search'?'AI 检索':r.kind==='explain'?'AI 解释':'功能未记录'} · ${clean(recordStatusLabel(r.status))} · ${pretty(r.created_at)}<br>${r.stage_recorded?clean(r.stage==='reading'?'阅读阶段':r.stage):'旧记录：未 function validScaleAnswers(value,count,max){return Array.isArray(value)&&value.length===count&&value.every(v=>Number.isInteger(v)&&v>=1&&v<=max)}
function rawUXSummary(task){const ux=task.ux;if(!ux?.submittedAt)return {sus:null,ueq:null};return {sus:validScaleAnswers(ux.susAnswers,10,5)?ux.susAnswers.reduce((a,b)=>a+b,0):null,ueq:validScaleAnswers(ux.ueqAnswers,26,7)?ux.ueqAnswers.reduce((a,b)=>a+b,0):null}}
function uxRawReport(task){const values=rawUXSummary(task);return `<h3>本轮 SUS 与 UEQ</h3><div class="ux-raw-totals"><p><strong>SUS 原始总分</strong><span>${values.sus===null?'未提交':values.sus+' / 50'}</span></p><p><strong>UEQ 原始总分</strong><span>${values.ueq===null?'未提交':values.ueq+' / 182'}</span></p></div><p class="small">SUS 原始答案：${values.sus===null?'未提交':task.ux.susAnswers.map(v=>v+' / 5').join('、')}</p><p class="small">UEQ 原始位置：${values.ueq===null?'未提交':task.ux.ueqAnswers.map(v=>v+' / 7').join('、')}</p><p class="small muted">原始总分为作答数值之和，未进行反向题校正；不代表百分比或统一的好坏方向。</p>`}
function meanSD(values){let n=0,mean=0,m2=0;for(const value of values){if(typeof value!=='number'||!Number.isFinite(value))continue;n++;const delta=value-mean;mean+=delta/n;m2+=delta*(value-mean)}return {n,mean:n?mean:null,sd:n>1?Math.sqrt(Math.max(0,m2/(n-1))):null}}
function statNumber(value){return typeof value==='number'&&Number.isFinite(value)?value.toFixed(2):'—'}
function numberOrNull(value,min=-Infinity,max=Infinity){if(value===null||value===undefined||value==='')return null;const n=typeof value==='number'?value:typeof value==='string'&&value.trim()?Number(value):NaN;return Number.isFinite(n)&&n>=min&&n<=max?n:null}
function uxItemValue(task,kind,index){const max=kind==='sus'?5:7,count=kind==='sus'?10:26,answers=task.ux?.[kind+'Answers'];return task.ux?.submittedAt&&validScaleAnswers(answers,count,max)?answers[index]:null}
function ueqDimensionValue(task,key){return task.ux?.submittedAt&&validScaleAnswers(task.ux.ueqAnswers,26,7)?scoreUEQ(task.ux.ueqAnswers).scales[key]:null}

 {id:'content_survey_seconds',section:'summary',label:'理解与阅读体验问卷用时',unit:'秒',get:t=>t.survey?.submittedAt?numberOrNull(t.survey.durationSeconds,0):null},

 ...SUS.map((q,i)=>({id:'sus_'+(i+1),section:'sus',label:'SUS '+(i+1)+' · '+q,max:5,get:t=>uxItemValue(t,'sus',i)})),
 ...UEQ.map(([left,right],i)=>({id:'ueq_'+(i+1),section:'ueq',label:'UEQ '+(i+1)+' · '+left+' → '+right,max:7,get:t=>uxItemValue(t,'ueq',i)})),
 ...Object.keys(UEQ_SCALES).map(key=>({id:'ueq_dimension_'+key,section:'ueqDimensions',label:UEQ_LABELS[key],unit:'−3 至 +3',get:t=>ueqDimensionValue(t,key)}))
]}
function participantMetricStats(sessions,condition,metric){const perPerson=[],taskValues=[];for(const session of sessions){const values=session.tasks.filter(t=>t.condition===condition).map(metric.get).filter(v=>typeof v==='number'&&Number.isFinite(v));taskValues.push(...values);if(values.length)perPerson.push(values.reduce((a,b)=>a+b,0)/values.length)}return {...meanSD(perPerson),taskN:taskValues.length}}
function categoryStats(sessions,field){const options=field.options.map(o=>Array.isArray(o)?{value:o[0],label:o[1]}:{value:o,label:o});let n=0;const counts=new Map(options.map(o=>[o.value,0]));for(const s of sessions){const value=s.pre?.[field.id],selected=field.type==='multi'?Array.isArray(value)?[...new Set(value)].filter(v=>counts.has(v)):[]:counts.has(value)?[value]:[];if(!selected.length)continue;n++;for(const v of selected)counts.set(v,counts.get(v)+1)}return {id:field.id,label:field.label,n,missing:sessions.length-n,multiple:field.type==='multi',options:options.map(o=>({...o,count:counts.get(o.value)}))}}
function buildStudyStatistics(input=allSessions(),scope=statisticsScope){const sessions=input.filter(s=>s.mode==='study'&&s.consentAt&&(scope!=='completed'||s.status==='completed')),tasks=sessions.flatMap(s=>s.tasks),ages=sessions.map(s=>numberOrNull(s.pre?.age,1,120)).filter(v=>v!==null),metrics=statisticsMetrics();return {version:'study-statistics-v3',scope,sessions,counts:{participants:sessions.length,completed:sessions.filter(s=>s.status==='completed').length,readingTasks:tasks.filter(t=>t.reading).length,uxSubmitted:tasks.filter(t=>t.ux?.submittedAt).length,interviewYes:sessions.filter(s=>s.followUpInterview?.willing==='yes'&&s.followUpInterview.submittedAt).length},age:meanSD(ages),categories:PROFILE_FIELDS.filter(f=>f.options).map(f=>categoryStats(sessions,f)),groups:CONDITIONS.map(condition=>({condition,label:tag(condition),rows:metrics.map(metric=>({id:metric.id,section:metric.section,label:metric.label,max:metric.max??null,unit:metric.unit||'',...participantMetricStats(sessions,condition,metric)}))}))}}
function statisticsExportRows(stats){const comprehension=comprehensionStatistics(stats.sessions);return [...extendedStatisticsRows(stats),{group:'参与者',metric:'age',label:'年龄',section:'demographic',max:'',unit:'岁',n:stats.age.n,task_n:'',mean:stats.age.mean,sd:stats.age.sd},...[comprehension.total,...comprehension.materials].map(row=>({group:row.id==='comprehension_total'?'三篇合计':'作品',metric:row.id,label:row.label,section:'comprehension',max:row.max,unit:'',n:row.n,task_n:'',mean:row.mean,sd:row.sd,answer_key_version:COMPREHENSION_KEY_VERSION})),...stats.groups.flatMap(group=>group.rows.map(row=>({group:group.label,condition:group.condition,metric:row.id,label:row.label,section:row.section,max:row.max??'',unit:row.unit,n:row.n,task_n:row.taskN,mean:row.mean,sd:row.sd})))].map(row=>({...row,scope:stats.scope,sd_definition:'sample_n_minus_1'}))}
function statsTable(rows){return `<div class="scroll-x"><table class="report-table statistics-table"><thead><tr><th>项目</th><th>平均分 / 满分</th><th>SD</th><th>有效人数 N</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${clean(row.label)}</td><td>${statNumber(row.mean)}${row.max?' / '+row.max:row.unit?' '+clean(row.unit):''}</td><td>${statNumber(row.sd)}</td><td>${row.n}</td></tr>`).join('')}</tbody></table></div>`}
