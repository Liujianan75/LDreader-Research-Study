function interviewMarkup(){const value=current.followUpInterview||{},willing=value.willing||'';return `<section class="card mt22 interview-card"><h2 class="section-title">愿意再和我们聊一聊吗？</h2><p>我们邀请你参加一次约 <strong>15 分钟的线上访谈</strong>。完成访谈后，可额外获得 <strong>30 角端点数</strong>。</p><p class="small muted">访谈完全自愿，不影响本次实验的点数核验。</p><form id="interview-form" novalidate><fieldset class="interview-options"><legend>你是否愿意接受线上访谈？</legend><label><input type="radio" name="interview-willing" value="yes" ${willing==='yes'?'checked':''}>愿意</label><label><input type="radio" name="interview-willing" value="no" ${willing==='no'?'checked':''}>暂不参加</label></fieldset><div id="interview-contact-wrap" ${willing==='yes'?'':'hidden'}><label for="interview-contact">微信号或邮箱</label><input id="interview-contact" type="text" maxlength="160" autocomplete="off" value="${clean(willing==='yes'?value.contact||'':'')}" placeholder="请填写方便联系你的微信号或邮箱"><p class="small muted">联系方式用于本次访谈邀请。</p></div><p class="error" id="interview-error" role="alert"></p><p id="interview-saved" class="small" role="status">${value.submittedAt?'你的访谈意向已保存。':''}</p><button type="submit" class="btn primary" id="interview-submit" ${previewNavigation||current.status!=='completed'?'disabled':''}>${value.submittedAt?'更新访谈意向':'保存访谈意向'}</button></form></section>`}
function saveInterviewPreference(){if(previewNavigation||current?.status!=='completed')return false;const selected=document.querySelector('input[name="interview-willing"]:checked')?.value,contact=$('interview-contact').value.trim();if(!['yes','no'].includes(selected)){$('interview-error').textContent='请选择愿意或暂不参加。';return false}if(selected==='yes'&&(!contact||contact.length>160)){$('interview-error').textContent='请填写微信号或邮箱，最多 160 字。';return false}const value={version:'post-study-interview-v1',willing:selected,contact:selected==='yes'?contact:'',submittedAt:current.followUpInterview?.submittedAt||now(),updatedAt:now()};const previous=current.followUpInterview;current.followUpInterview=value;current.sessionEvents??=[];const event={id:uid(),at:now(),type:'INTERVIEW_PREFERENCE_SAVE',payload:{willing:selected,hasContact:!!value.contact}};current.sessionEvents.push(event);if(!save()){current.followUpInterview=previous;current.sessionEvents=current.sessionEvents.filter(e=>e.id!==event.id);$('interview-error').textContent='保存失败，请稍后重试。';return false}render();return true}

function previewIndex(){if(previewNavigation)return previewNavigation.index;const round=Math.max(0,(activeTask()?.index||1)-1);return Math.max(0,previewModules().findIndex(m=>m.view===view&&(m.round===undefined||m.round===round)))}
function previewToolbar(){if(!adminUnlocked||!isDemo()||!['consent','library','reading','survey','roundUX','comparison'].includes(view))return '';const modules=previewModules(),index=previewIndex();return `<div class="preview-nav"><div><strong>自由预览</strong><small>${previewNavigation?'仅查看页面 · 跳转不保存作答或完成记录':'可跳过阅读与必填项，直接查看后续模块'}</small></div><label class="sr-only" for="preview-module">跳转到模块</label><select id="preview-module">${modules.map((m,i)=>`<option value="${i}" ${i===index?'selected':''}>${i+1}. ${clean(m.label)}</option>`).join('')}</select><button class="btn primary" id="preview-next" ${index===modules.length-1?'disabled':''}>下一模块 →</button>${previewNavigation?'<button class="btn" id="preview-return">返回原进度</button>':''}</div>`}
function jumpPreview(index){if(!adminUnlocked||!isDemo()||!Number.isInteger(index)||index<0||index>=previewModules().length)return false;if(!previewNavigation){syncReading();previewNavigation={original:current,view,index,scroll:renderScroll,selectedMaterial,textLanguage}}previewNavigation.index=index;const original=previewNavigation.original;current=JSON.parse(JSON.stringify(original));current.tasks=newSession({id:original.id,number:original.number},'study').tasks;current.mode='demo';current.previewOnly=true;current.status='running';current.postStudy=null;const module=previewModules()[index];view=module.view;renderScroll=0;activeAI=activeNote=activePara=null;textLanguage='translation';if(module.round!==undefined){const t=current.tasks[module.round];selectedMaterial=t.material;if(view==='reading'){view='library';render();openReader(t);return true}else t.status=view==='survey'?'survey':'ux'}if(view==='comparison')current.status='comparison';render();return true}

function attachPreview(){const selector=$('preview-module');if(selector)selector.onchange=e=>jumpPreview(Number(e.target.value));if($('preview-next'))$('preview-next').onclick=()=>jumpPreview(previewIndex()+1);if($('preview-return'))$('preview-return').onclick=()=>returnPreview();if(previewNavigation){for(const id of ['consent-next','finish-read','survey-submit','ux-submit','comparison-submit','interview-submit']){const el=$(id);if(el){el.disabled=true;el.title=view==='done'?'':'页面预览不提交数据，请使用下一模块或返回原进度。'}}}}

function load(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'{}');return {sessions:x.sessions||{},meta:x.meta||{created_at:now()}}}catch(e){return {sessions:{},meta:{created_at:now()}}}}

function header(){document.body.classList.toggle('reader-page',view==='reading');const tabs=(view==='library'||view==='reading')&&current?libraryMaterials().map(m=>`<div class="booktab ${view==='reading'&&selectedMaterial===m.id?'selected':''}">${clean(m.title)}</div>`).join(''):''; $('header').innerHTML=`<div class="brand"><img class="reader-logo" src="${READER_LOGO}" alt="角端 LDreader" width="99" height="45"></div><div class="head-center">${tabs}</div><div class="head-actions">${view==='reading'?`${readerSettingsMarkup()}<button class="icon-button" id="header-report" title="管理员入口" aria-label="管理员入口">${ico('chart')}</button>`:`<button class="icon-button" id="header-home" title="返回入口" aria-label="返回入口">${ico('home')}</button><button class="icon-button" id="header-report" title="管理员入口" aria-label="管理员入口">${ico('chart')}</button>`}</div>`; if($('header-home'))$('header-home').onclick=leaveToEntry;if($('header-report'))$('header-report').onclick=requestAdminAccess}

function ensureReading(t){recoverReaderAI(t);if(!t.reading){t.reading={startAt:now(),endAt:null,wallSeconds:null,visibleMs:0,languageMs:{translation:0,original:0},lastTick:Date.now(),maxScroll:0};t.status='reading';log('READ_START',{material:t.material,version:t.materialVersion,condition:t.condition,language:'translation',viewport:{width:window.innerWidth,height:window.innerHeight}},t)}else if(!t.reading.endAt){t.reading.lastTick=Date.now();log('READ_RESUME',{reason:'reopen',timingQuality:'resume_gap_excluded'},t)}if(!isDemo())current.tasks.forEach(x=>{if(x!==t&&x.status==='available')x.status='locked'});save()}

function leftWing(m,t){return `<div class="rail-heading">${ico('comment')}<span>读者批注</span><span class="rail-caption">读者观点</span></div><div class="margin-track"><p class="rail-empty" data-context-empty>继续阅读，相关批注会出现在对应段落旁。</p>${supportGroups(m,t.condition,'notes').map(({pid,items})=>`<div class="margin-context" data-context-group="${pid}" hidden>${items.map((n,i)=>`<article class="reader-margin-card"><button class="margin-card-title note-quote" data-note-open="${n.id}" aria-expanded="${i===0}" aria-controls="note-body-${n.id}"><span>${clean(n.title||n.quote)}</span><span aria-hidden="true">${i===0?'−':'+'}</span></button><div class="reader-note-body" id="note-body-${n.id}" data-note-body="${n.id}" ${i===0?'':'hidden'}><blockquote>${clean(n.quote)}</blockquote><p>${clean(n.body)}</p><button class="note-locate" data-note-locate="${n.id}">定位正文</button></div></article>`).join('')}</div>`).join('')}</div><details class="private-composer" ${t.privateDraft?.open?'open':''}><summary>＋ 留下我的批注</summary><p class="small muted">仅保存到本次个人记录。</p><label class="small" for="anchor-select">关联段落</label><select id="anchor-select" class="thin-select">${m.paragraphs.map((p,i)=>`<option value="${p.id}" ${t.privateDraft?.pid===p.id?'selected':''}>第 ${i+1} 段</option>`).join('')}</select><textarea id="private-note" rows="3" class="thin-select mt12" placeholder="写下自己的阅读想法">${clean(t.privateDraft?.text||'')}</textarea><button class="btn tiny mt12" id="save-private-note">保存私人批注</button><span class="fine"> 已保存 ${t.privateNotes?.length||0} 条</span></details>`}

function uxSubmit(){if(previewNavigation)return;const t=current.tasks.find(x=>x.status==='ux');if(!t||t.ux?.submittedAt)return;persistFormDraft(t,'ux','ux-form');const d=t.ux.draft,sus=SUS.map((_,i)=>d['sus'+i]),ueq=UEQ.map((_,i)=>d['ueq'+i]);if(sus.some(v=>!Number.isInteger(v)||v<1||v>5)){formError('ux-error','请完成 SUS 全部 10 题。');return}if(ueq.some(v=>!Number.isInteger(v)||v<1||v>7)){formError('ux-error','请完成 UEQ 全部 26 题。');return}const ueqScore=scoreUEQ(ueq);t.ux={startedAt:t.ux.startedAt,submittedAt:now(),durationSeconds:Math.max(0,(Date.now()-Date.parse(t.ux.startedAt))/1000),susAnswers:sus,susRawTotal:sus.reduce((a,b)=>a+b,0),susScore:scoreSUS(sus),susVersion:INSTRUMENTS.sus.version,ueqAnswers:ueq,ueqRawTotal:ueq.reduce((a,b)=>a+b,0),ueqTransformed:ueqScore.transformed,ueqScales:ueqScore.scales,ueqVersion:INSTRUMENTS.ueq.version};t.status='done';log('ROUND_UX_SUBMIT',{susVersion:t.ux.susVersion,ueqVersion:t.ux.ueqVersion},t);if(!isDemo()){const next=current.tasks.find(x=>x.status==='locked');if(next)next.status='available'}if(current.tasks.length>=3&&current.tasks.every(x=>x.status==='done')){current.status='comparison'}else current.status='running';save();view=current.status==='comparison'?'comparison':'library';render()}

else if(kind==='surveys')rows=s.flatMap(x=>x.tasks.filter(t=>t.survey).flatMap(t=>Object.entries(t.survey).filter(([k])=>k!=='draft').map(([k,v])=>({participant:x.id,round:t.index,material:t.material,condition:t.condition,question_id:k,answer:typeof v==='object'?JSON.stringify(v):v}))));
download(csv(rows),filename,'text/csv;charset=utf-8')}
function render(){if(activeReaderAI&&(view!=='reading'||liveTask()?.id!==activeReaderAI.record.taskId||current?.id!==activeReaderAI.record.sessionId))cancelReaderAI('navigation');if(view!=='reading'){renderScroll=0;readerSettingsOpen=false;readerSelection=null;}header();const html={entry:pageEntry,consent:pageConsent,library:pageLibrary,reading:pageReading,survey:pageSurvey,roundUX:pageRoundUX,comparison:pageComparison,done:pageDone,reports:reportPage,seatAdmin:pageSeatAdmin,studyStatistics:pageStudyStatistics,participantReport:pageParticipant}[view]();$('preview-bar').innerHTML=previewToolbar();$('app').innerHTML=html;attach();attachPreview();if(view==='reading'){const box=$('reader-scroll');box.scrollTop=renderScroll;updateReadingContext();box.addEventListener('scroll',()=>{const t=liveTask(),language=displayedLanguage(t.condition),max=box.scrollHeight-box.clientHeight,pct=max>0?Math.round(100*box.scrollTop/max):100;t.reading.maxScroll=Math.max(t.reading.maxScroll||0,pct);t.reading.scrollByLanguage??={translation:0,original:0};t.reading.scrollByLanguage[language]=Math.max(t.reading.scrollByLanguage[language]||0,pct);$('scroll-bar').style.width=t.reading.maxScroll+'%';renderScroll=box.scrollTop;updateReadingContext();if(Date.now()-interactDebounce>900){interactDebounce=Date.now();log('SCROLL',{ratio:pct,language})}},{passive:true})}else window.scrollTo({top:0,behavior:'instant'})}
function updateReadingContext(preferredPid=null){const t=liveTask();if(!t||t.condition==='B')return;const m=MATERIALS[t.material],box=$('reader-scroll'),bounds=box.getBoundingClientRect(),selected={ai:null,notes:null};document.querySelectorAll('.reader-wing').forEach(wing=>{const kind=wing.classList.contains('left-rail')?'notes':'ai',ids=[...new Set(m[kind].map(a=>a.pid))];let pid=preferredPid&&ids.includes(preferredPid)?preferredPid:null;if(!pid){const visible=ids.map(id=>({id,rect:$(id).getBoundingClientRect()})).filter(x=>x.rect.bottom>bounds.top+20&&x.rect.top<bounds.bottom-40).sort((a,b)=>Math.abs(a.rect.top-bounds.top-60)-Math.abs(b.rect.top-bounds.top-60));pid=visible[0]?.id||null}selected[kind]=pid;const track=wing.querySelector('.margin-track');let shown=false;wing.querySelectorAll('[data-context-group]').forEach(group=>{const match=!!pid&&group.dataset.contextGroup===pid;group.hidden=!match;if(match){shown=true;const top=Math.max(0,Math.min($(pid).getBoundingClientRect().top-track.getBoundingClientRect().top,Math.max(0,track.clientHeight-250)));group.style.top=top+'px';group.style.maxHeight=Math.max(180,track.clientHeight-top-6)+'px'}});const empty=wing.querySelector('[data-context-empty]');if(empty)empty.hidden=shown});activePara=preferredPid||selected.ai||selected.notes;document.querySelectorAll('[data-para]').forEach(el=>el.classList.toggle('context-active',el.id===selected.ai||el.id===selected.notes));const sel=$('anchor-select');if(sel&&activePara&&!t.privateDraft?.pid)sel.value=activePara;const signature=JSON.stringify(selected);if(t.reading.contextSignature!==signature){t.reading.contextSignature=signature;log('SUPPORT_CONTEXT_VIEW',{aiParagraph:selected.ai,noteParagraph:selected.notes,aiIds:m.ai.filter(a=>a.pid===selected.ai).map(a=>a.id),noteIds:t.condition==='C2'?m.notes.filter(n=>n.pid===selected.notes).map(n=>n.id):[]})}}

function attach(){const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn)};
if(view==='entry'){on('entry-start',startEntry);on('entry-resume',resumeSession);document.querySelectorAll('[data-seat]').forEach(el=>el.onclick=()=>{selectedCode=el.dataset.seat;render()});entryMode='study'}
if(view==='consent'){on('consent-next',consentNext);attachProfileFields()}
if(view==='library'){document.querySelectorAll('[data-library-material]').forEach(el=>el.onclick=()=>libraryClick(el.dataset.libraryMaterial));on('lib-reports',requestAdminAccess);on('preview-admin-return',openAdminReports);const sel=$('demo-condition');if(sel)sel.onchange=()=>{demoCondition=sel.value;render()}}
if(view==='reading'){on('finish-read',finishReading);attachReader(false);attachReaderTools()}
if(view==='survey'||view==='roundUX'){const ux=view==='roundUX',t=current.tasks.find(x=>x.status===(ux?'ux':'survey')),kind=ux?'ux':'survey',formId=ux?'ux-form':'content-form';if(!t[kind]?.startedAt){t[kind]={startedAt:now(),draft:{}};save()}const form=$(formId);form.addEventListener('submit',e=>e.preventDefault());form.addEventListener('change',()=>persistFormDraft(t,kind,formId));form.addEventListener('input',()=>persistFormDraft(t,kind,formId));on(ux?'ux-submit':'survey-submit',ux?uxSubmit:surveySubmit)}
if(view==='comparison'){if(!current.postStudy?.startedAt){current.postStudy={startedAt:now(),draft:{}};current.sessionEvents??=[];current.sessionEvents.push({id:uid(),at:now(),type:'FINAL_COMPARISON_OPEN'});save()}const form=$('comparison-form');form.addEventListener('submit',e=>e.preventDefault());form.addEventListener('change',()=>persistFormDraft(current,'postStudy','comparison-form'));form.addEventListener('input',()=>persistFormDraft(current,'postStudy','comparison-form'));on('comparison-submit',comparisonSubmit)}
if(view==='done')attachInterview()
if(view==='reports'){on('admin-statistics',openStatistics);on('admin-seat-manager',openSeatAdmin);on('admin-gated-open',requestAdminAccess);on('admin-preview',startAdminPreview);document.querySelectorAll('[data-export]').forEach(el=>el.onclick=()=>exportData(el.dataset.export));on('report-home',leaveToEntry);on('reset-local',()=>{if(prompt('此操作不可撤销。输入 CLEAR 确认清空本机所有记录：')!=='CLEAR')return;for(let n=1;n<=48;n++)localStorage.removeItem(CLAIM_PREFIX+'P'+String(n).padStart(3,'0'));localStorage.removeItem(STORAGE);sessionStorage.removeItem(STORAGE+'_active');db={sessions:{},meta:{created_at:now()}};current=null;save();notice('本机数据已清空');render()})}
if(view==='studyStatistics'){on('admin-gated-open',requestAdminAccess);if(adminUnlocked)attachStatistics()}
if(view==='seatAdmin'){on('admin-gated-open',requestAdminAccess);if(adminUnlocked)attachSeatAdmin()}
if(view==='participantReport'){on('participant-back',()=>{if(adminUnlocked)openAdminReports();else{view=current?.status==='completed'?'done':'library';render()}});on('participant-export',()=>{const s=db.sessions[window.reportID];download(JSON.stringify(scoredSession(s),null,2),s.id+'_full_report.json','application/json')})}
}
function locate(pid){const box=$('reader-scroll'),el=$(pid);if(!box||!el)return;box.scrollTop+=el.getBoundingClientRect().top-box.getBoundingClientRect().top-50;renderScroll=box.scrollTop;updateReadingContext(pid)}
function attachReader(){const t=liveTask(),m=MATERIALS[t.material];const composer=document.querySelector('.private-composer');if(composer)composer.addEventListener('toggle',()=>{t.privateDraft??={pid:$('anchor-select').value,text:$('private-note').value};t.privateDraft.open=composer.open;save();updateReadingContext()});const draft=()=>{t.privateDraft={pid:$('anchor-select').value,text:$('private-note').value,open:composer.open};save()};if($('private-note'))$('private-note').oninput=draft;if($('anchor-select'))$('anchor-select').onchange=draft;if($('confirm-finish'))$('confirm-finish').onclick=()=>finishReading(true);if($('cancel-finish'))$('cancel-finish').onclick=()=>$('reading-confirm').close();if($('support-jump'))$('support-jump').onchange=e=>{if(e.target.value){log('SUPPORT_JUMP',{paragraph:e.target.value});locate(e.target.value)}};
document.querySelectorAll('[data-text-language]').forEach(el=>el.onclick=()=>switchReaderLanguage(el.dataset.textLanguage));
document.querySelectorAll('[data-ai-open]').forEach(el=>el.onclick=()=>{if(t.condition==='B')return;const ai=m.ai.find(a=>a.id===el.dataset.aiOpen);if(!ai)return;const body=document.querySelector('[data-ai-body="'+ai.id+'"]');body.hidden=!body.hidden;el.setAttribute('aria-expanded',String(!body.hidden));el.lastElementChild.textContent=body.hidden?'+':'−';log(body.hidden?'AI_CLOSE':'AI_OPEN',{ai:ai.id,paragraph:ai.pid});updateReadingContext(ai.pid)});
document.querySelectorAll('[data-ai-source]').forEach(el=>el.onclick=()=>{if(t.condition==='B')return;const ai=m.ai.find(a=>a.id===el.dataset.aiSource),body=document.querySelector('[data-source-body="'+ai.id+'"]');body.hidden=!body.hidden;el.setAttribute('aria-expanded',String(!body.hidden));if(!body.hidden)log('AI_SOURCE_OPEN',{ai:ai.id,paragraph:ai.pid})});
document.querySelectorAll('[data-note-open]').forEach(el=>el.onclick=()=>{if(t.condition!=='C2')return;const note=m.notes.find(n=>n.id===el.dataset.noteOpen);if(!note)return;const body=document.querySelector('[data-note-body="'+note.id+'"]');body.hidden=!body.hidden;el.setAttribute('aria-expanded',String(!body.hidden));el.lastElementChild.textContent=body.hidden?'+':'−';log(body.hidden?'ANNOTATION_CLOSE':'ANNOTATION_OPEN',{note:note.id,paragraph:note.pid});updateReadingContext(note.pid)});
document.querySelectorAll('[data-note-locate]').forEach(el=>el.onclick=()=>{if(t.condition!=='C2')return;const note=m.notes.find(n=>n.id===el.dataset.noteLocate);if(!note)return;log('ANNOTATION_LOCATE',{note:note.id,paragraph:note.pid});locate(note.pid)});
document.querySelectorAll('[data-inline-support]').forEach(el=>{const open=e=>{if(window.getSelection()?.toString().trim())return;e.stopPropagation();if(t.condition==='B')return;const isAI=el.dataset.supportKind==='ai';if(!isAI&&t.condition!=='C2')return;const item=(isAI?m.ai:m.notes).find(x=>x.id===el.dataset.inlineSupport);if(!item)return;updateReadingContext(item.pid);if(isAI){const body=document.querySelector('[data-ai-body="'+item.id+'"]');body.hidden=false;const button=document.querySelector('[data-ai-open="'+item.id+'"]');button.setAttribute('aria-expanded','true');button.lastElementChild.textContent='−'}else{const body=document.querySelector('[data-note-body="'+item.id+'"]');body.hidden=false;const button=document.querySelector('[data-note-open="'+item.id+'"]');button.setAttribute('aria-expanded','true');button.lastElementChild.textContent='−'}log(isAI?'AI_OPEN':'ANNOTATION_OPEN',{id:item.id,paragraph:item.pid,trigger:'inline'})};el.onclick=open;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(e)}}});
document.querySelectorAll('[data-para]').forEach(el=>el.onclick=()=>{if(t.condition==='B')return;updateReadingContext(el.dataset.para);log('PARAGRAPH_FOCUS',{pid:el.dataset.para})});
const btn=$('save-private-note');if(btn)btn.onclick=()=>{if(t.condition!=='C2')return;const text=$('private-note').value.trim(),pid=$('anchor-select').value;if(!text){notice('请输入批注内容');return}t.privateNotes.push({id:uid(),pid,text,createdAt:now()});t.privateDraft=null;log('ANNOTATION_CREATE',{pid,length:text.length});saveReaderScroll();save();render();notice('私人批注已保存')};
}
window.addEventListener('visibilitychange',()=>{if(view==='reading'){const t=liveTask();if(!t?.reading)return;syncReading();t.reading.hidden=document.hidden;t.reading.lastTick=Date.now();log(document.hidden?'TAB_HIDDEN':'TAB_VISIBLE')}});
window.addEventListener('pagehide',()=>{if(activeReaderAI)cancelReaderAI('pagehide');if(view==='reading'){syncReading();log('READ_PAGEHIDE')}});
window.addEventListener('resize',()=>{if(view==='reading'){updateReadingContext();log('LAYOUT_CHANGE',{width:window.innerWidth,height:window.innerHeight})}});
window.addEventListener('storage',handleStorageUpdate);
setInterval(()=>{if(view==='reading')syncReading()},5000);
// 入口不自动恢复上一位受试者；输入原实验编号即可恢复本机已保存的任务。
attachGlobalDialogs();
attachSeatReleaseDialog();
render();
})();
