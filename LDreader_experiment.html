 EN:{id:'EN',label:'英语文学',tag:'ENGLISH',glyph:'E',cover:'en',title:'英语文学演示片段',subtitle:'节日、礼物与家庭选择',author:'演示原创文本 · 非正式文学材料',paragraphs:[
  {id:'en-1',text:'十二月的街道已经挂满了灯。店铺门口摆着绿色花环，橱窗里放着一个又一个绑着丝带的礼盒。艾琳把围巾向上拉了拉，数着口袋里的零钱。她原本想为家人准备一件特别的节日礼物，但今年他们的收入比往年更少。'},
  {id:'en-2',text:'她经过一间钟表店，想起父亲那只磨损的怀表。父亲每年都会在节日前把它擦亮，说那是祖父留下的东西。艾琳知道，怀表本身并不昂贵，可父亲总把它放在离心口最近的口袋里。'},

  {id:'en-4',text:'第二天清晨，艾琳将一张亲手写的卡片放在餐盘旁。卡片里写着他们小时候一起走过的那条路。父亲读完后收起了怀表。她忽然觉得，自己一直把节日理解成互相交换物品，却忽略了家人真正珍惜的记忆。'},

  {id:'ja-1',text:'小镇的夏祭从傍晚开始。沿路挂着纸灯笼，鼓点从街角传来。千夏跟在祖母身后，手里捧着一张写有愿望的小纸片。她听见有人提到“绘马”，却不确定木牌上的字为什么不能随便给别人看。'},
  {id:'ja-2',text:'祖母在神社入口放慢脚步，先整理衣领，再向前轻轻行礼。千夏原想直接跑向热闹的摊位，看到祖母的动作后又停了下来。她不明白，自己究竟是出于尊重才停下，还是害怕旁人觉得她失礼。'},

function validatePlans(){let pairs={},conditions={},materialPos={};for(const p of PLAN){for(let i=0;i<3;i++){let c=p.order[i],m=p.assign[c];pairs[m+'-'+c]=(pairs[m+'-'+c]||0)+1;conditions[c+'-'+i]=(conditions[c+'-'+i]||0)+1;materialPos[m+'-'+i]=(materialPos[m+'-'+i]||0)+1}}return [pairs,conditions,materialPos].every(t=>Object.values(t).length===9&&Object.values(t).every(v=>v===2))}

function pageEntry(){return `<div class="intro"><div class="eyebrow">LDREADER · HUMAN-AI READING STUDY</div><h1>跨文化文学阅读实验平台</h1><p class="lead">中文阅读英、日、韩文学作品的译文，比较不同辅助形式对阅读体验及理解的影响。</p><div class="notice"><strong>研究原型说明：</strong>当前内置的是<strong>虚构演示文本、示例 AI 解释与虚构批注</strong>，仅用于验证界面和流程；数据仅存储在此浏览器。尚不可直接作为正式受试实验平台。</div>${stepper(0)}<div class="card"><h2 class="section-title">开始实验</h2><div class="field"><label>选择运行模式</label><div class="radio-pair"><label><input type="radio" name="mode" value="study" checked /> 本机实验流程模拟（按编号抗序）</label><label><input type="radio" name="mode" value="demo" /> 自由演示（选文章与条件）</label></div></div><div class="form-grid"><div class="field"><label for="pid">实验编号</label><input id="pid" autocomplete="off" inputmode="numeric" placeholder="例如 P001、P002、P003" /><div class="small muted mt12">建议使用连续编号 P001、P002...，每 6 人形成一个完整平衡单元。数据不会自动同步到其他电脑。</div></div><div class="field"><label>当前版本功能</label><div class="small readme" style="padding:10px 0">✓ 三种条件 B / C1 / C2<br>✓ 六套分配方案与任务状态恢复<br>✓ 阅读后问卷、SUS、SEQ<br>✓ 本机报告和 JSON / CSV 导出</div></div></div><button class="btn primary" id="entry-start">进入系统 ${ico('arrow')}</button><span id="entry-error" class="error" style="margin-left:14px"></span></div><div class="footer-center">Local-only prototype · 无服务器、无需安装、请勿在同一浏览器存储敏感身份信息</div></div>`}
function startEntry(){const p=parseCode($('pid').value);if(!p){$('entry-error').textContent='请输入有效的正整数实验编号，例如 P001。';return}const m=document.querySelector('input[name="mode"]:checked').value,id=m==='demo'?'DEMO-'+p.id:p.id;let sess=db.sessions[id];if(!sess){sess=newSession({...p,id},m)}setCurrent(sess);view=sess.status==='consent'?'consent':sess.status==='completed'?'done':sess.status==='usability'?'usability':'library';render()}

function saveReaderScroll(){const b=$('reader-scroll');if(b)renderScroll=b.scrollTop}
function rightWing(m,usability=false){const ai= m.ai.map(a=>`<div class="note-item ${activeAI===a.id?'active':''}" data-ai-open="${a.id}" role="button" tabindex="0"><strong>${clean(a.title)}</strong><p>${clean(a.body)}</p>${activeAI===a.id?`<button class="btn tiny soft" data-ai-source="${a.id}">查看来源</button>${showSource?`<div class="source">${clean(a.source)}</div>`:''}`:''}</div>`).join('');return `<div class="wing-card"><div class="wing-heading">${ico('spark')}<span class="wing-title" style="margin:0">AI 文化解释</span></div><p class="wing-info">选取右侧卡片可在正文中定位对应段落。正式实验将使用审核后的固定解释。</p>${ai}</div><div class="right-edge-label">${usability?'统一可用性任务模式':'AI CULTURAL EXPLANATIONS'}</div>`}
function leftWing(m,t,usability=false){const notes=m.notes.map(n=>`<div class="note-item purple ${activeNote===n.id?'active':''}" data-note-open="${n.id}" tabindex="0" role="button"><strong>${clean(n.who)}</strong><p>${clean(n.text)}</p><span class="tiny muted">${clean(n.origin)}</span></div>`).join('');const own=t?.privateNotes||[];return `<div class="wing-card"><div class="wing-heading">${ico('comment')}<span class="wing-title" style="margin:0">读者批注</span></div><p class="wing-info">以下内容均为虚构的界面演示批注，不代表真实参与者观点。正式材料需要真实授权。</p>${notes}</div><div class="wing-card"><div class="wing-title">留下我的批注</div><p class="wing-info">默认绑定至当前选择的正文段落。批注仅存在本机私人记录中。</p><label class="small" for="anchor-select">关联段落</label><select id="anchor-select" class="thin-select">${m.paragraphs.map((p,i)=>`<option value="${p.id}" ${(activePara||m.paragraphs[0].id)===p.id?'selected':''}>第 ${i+1} 段</option>`).join('')}</select><textarea id="private-note" rows="3" style="width:100%;border:1px solid #cbd6c6;border-radius:9px;padding:10px;background:white;margin-top:9px" placeholder="记录我的观点（演示）"></textarea><button class="btn primary tiny mt12" id="save-private-note">保存个人批注</button>${own.length?`<div class="small muted mt12">已保存 ${own.length} 条个人批注</div>`:''}</div>`}
function textPanel(m,condition,usability=false){return `<div class="reader-paragraphs" aria-label="文学正文" id="paragraphs">${m.paragraphs.map((p,i)=>`<p id="${p.id}" data-para="${p.id}" class="${condition==='B'?'':'annotatable'} ${activePara===p.id?'active-para':''} ${condition!=='B'&&([...m.ai.map(a=>a.pid),...m.notes.map(a=>a.pid)].includes(p.id))?'has-mark':''}">${clean(p.text)}</p>`).join('')}</div>`}
function readingContent(t,usable=false){const m=MATERIALS[t.material],c=usable?'C2':t.condition;return `<div class="reader-viewport"><div class="reader-metadata"><div class="flex gap8"><span>${clean(m.title)}</span><span class="chip gold">演示译文</span></div><div class="flex gap8"><span>${tag(c)}</span><span>段落 ${m.paragraphs.length}</span></div></div><div class="progress-track"><div class="progress-fill" id="scroll-bar" style="width:${t.reading?.maxScroll||0}%"></div></div><div class="reader-grid"><aside class="reader-wing ${c==='C2'?'':'empty'}" aria-label="读者批注区">${c==='C2'?leftWing(m,t,usable):''}</aside><section class="reader-body" id="reader-scroll" aria-label="正文阅读区">${textPanel(m,c,usable)}</section><aside class="reader-wing ${c==='B'?'empty':''}" aria-label="AI 文化解释区">${c!=='B'?rightWing(m,usable):''}</aside></div><div class="reader-toolbar"><span class="hint">${usable?'请根据上方可用性任务操作左、中、右区域。':'请阅读后进入问卷；系统将在本机记录阅读时间和操作。'}</span>${!usable?'<button class="btn primary" id="finish-read">我已读完，进入问卷</button>':''}</div></div>`}
function pageReading(){let t=liveTask();if(!t){view='library';return pageLibrary()}return readingContent(t,false)}
function finishReading(){const t=liveTask();if(!t)return;syncReading();if(!confirm('确认结束本轮阅读并进入问卷？结束后不能返回正文。'))return;t.reading.endAt=now();t.reading.wallSeconds=Math.max(0,Math.round((Date.parse(t.reading.endAt)-Date.parse(t.reading.startAt))/1000));t.status='survey';log('READ_FINISH',{wallSeconds:t.reading.wallSeconds},t);save();view='survey';render()}
function scale(name,max,value=0,left='非常低 / 非常不同意',right='非常高 / 非常同意'){return `<div class="scale-line" role="radiogroup" aria-label="${clean(name)}">${Array.from({length:max},(_,i)=>`<label title="${i+1}"><input type="radio" name="${name}" value="${i+1}" ${String(value)===String(i+1)?'checked':''}/> ${i+1}</label>`).join('')}</div><div class="scale-labels"><span>${left}</span><span>${right}</span></div>`}
function pageSurvey(){const t=current.tasks.find(x=>x.status==='survey');if(!t){view='library';return pageLibrary()}const m=MATERIALS[t.material],d=t.survey?.draft||{};return `<div class="survey"><div class="eyebrow">AFTER READING · ROUND ${t.index}</div><h1>阅读后问卷</h1><p class="lead">${m.title} · ${tag(t.condition)}。请根据刚才的阅读作答，不再查看正文。</p>${stepper(2)}<div class="card"><div class="notice blue">本问卷题目仅用作验证功能的演示题，正式研究时必须替换为针对真实文学材料、经专家审查的问题。开放式回答不自动由 AI 评分。</div><h2 class="section-title mt22">A. 文化与文本理解</h2>${m.questions.map((q,i)=>`<section class="question"><h3>${i+1}. ${clean(q.q)}</h3><div class="choices">${q.options.map((o,j)=>`<label><input type="radio" name="${q.id}" value="${j}" ${String(d[q.id])===String(j)?'checked':''}/> ${clean(o)}</label>`).join('')}</div></section>`).join('')}<h2 class="section-title mt22">B. 开放式文学阐释</h2><section class="question"><h3>${clean(m.interpretation)}</h3><p class="desc">建议结合文本细节说明推理。系统保存原始回答，专家评分需在正式分析阶段进行。</p><textarea id="interpretation" rows="5" class="thin-select" placeholder="请写出自己的解释与文本证据">${clean(d.interpretation||'')}</textarea></section><h2 class="section-title mt22">C. 阅读感受</h2><section class="question"><h3>4. 理解这段内容，你投入了多少心智努力？</h3>${scale('effort',9,d.effort,'非常低','非常高')}</section><section class="question"><h3>5. 这次阅读体验是连贯的，没有被信息切换频繁打断。</h3>${scale('flow',7,d.flow)}</section><section class="question"><h3>6. 我能够形成自己的文学解释，而不只是照搬外部答案。</h3>${scale('agency',7,d.agency)}</section><section class="question"><h3>7. 这次阅读帮助我考虑了之前可能没有注意到的解释。</h3>${scale('perspective',7,d.perspective)}</section><section class="question"><h3>8. 哪些内容帮助了你？你还有什么困惑？（选填）</h3><textarea id="feedback" rows="3" class="thin-select" placeholder="自由填写">${clean(d.feedback||'')}</textarea></section><div id="survey-error" class="error"></div><div class="mt22 flex between wrap gap12"><span class="small muted">提交后不可修改，作答数据保存于当前浏览器。</span><button class="btn primary" id="survey-submit">提交本轮问卷 ${ico('arrow')}</button></div></div></div>`}
function surveySubmit(){let t=current.tasks.find(x=>x.status==='survey');if(!t)return;const d=t.survey?.draft||{};const m=MATERIALS[t.material];for(const q of m.questions){const r=document.querySelector(`input[name="${q.id}"]:checked`);if(!r){$('survey-error').textContent='请完成三道文化理解题';return}d[q.id]=Number(r.value)}d.interpretation=$('interpretation').value.trim();if(!d.interpretation){$('survey-error').textContent='请填写开放式文学阐释';return}for(const key of ['effort','flow','agency','perspective']){const r=document.querySelector(`input[name="${key}"]:checked`);if(!r){$('survey-error').textContent='请完成所有量表题';return}d[key]=Number(r.value)}d.feedback=$('feedback').value.trim();let score=m.questions.filter(q=>d[q.id]===q.key).length;t.survey={...d,culturalScore:score,maxScore:m.questions.length,submittedAt:now(),durationSeconds: t.survey?.startedAt?Math.round((Date.now()-Date.parse(t.survey.startedAt))/1000):null};t.status='done';log('SURVEY_SUBMIT',{score:score,scale:{effort:d.effort,flow:d.flow,agency:d.agency,perspective:d.perspective}},t);if(!isDemo()){let n=current.tasks.find(z=>z.status==='locked');if(n)n.status='available'}current.status=doneCount()>=3&&!isDemo()?'usability':'running';save();if(current.status==='usability'){current.usability.startedAt=now();view='usability'}else view='library';render()}
function pageUsability(){const u=current.usability;if(!u.startedAt){u.startedAt=now();save()}let i=u.taskIndex;if(i<UTASKS.length){let x=UTASKS[i];const existing=u.results[i],done=existing?.done;return `<div class="library-wrap"><div class="eyebrow">SYSTEM USABILITY TEST</div><h1>统一可用性任务 · ${i+1} / 3</h1>${stepper(3)}<div class="notice blue">所有参与者在完成三个阅读条件后，用完整 C2 界面测试相同操作。本环节与阅读理解评价分开记录。</div><div class="task-banner"><div class="eyebrow">TASK ${i+1}</div><h3>${clean(x.title)}</h3><p class="small">${clean(x.desc)}</p><div class="flex gap12 wrap"><button class="btn primary" id="task-launch">${u.currentTaskStartedAt?'继续任务':'开始操作任务'}</button><button class="btn" id="task-skip">无法完成此任务</button></div></div>${existing?`<div class="card"><div class="small">本次任务结果：${existing.success?'成功':'未完成'} · 用时 ${fmt(existing.durationSeconds)}</div><h3>这项操作有多容易？（SEQ，1 至 7）</h3>${scale('seq',7,existing.seq,'非常困难','非常容易')}<button class="btn primary mt16" id="task-next">确认评价并继续</button></div>`:''}</div>`}return `<div class="survey"><div class="eyebrow">SYSTEM USABILITY SCALE</div><h1>系统可用性问卷（SUS）</h1><p class="lead">以下是演示性中文表述，正式研究应采用研究者选定并核实的正式量表译本。</p>${stepper(3)}<div class="card"><p class="small">每题 1 至 5 分，1 为非常不同意，5 为非常同意。</p>${SUS.map((q,i)=>`<section class="question"><h3>${i+1}. ${clean(q)}</h3>${scale('sus'+i,5,u.sus[i],'非常不同意','非常同意')}</section>`).join('')}<section class="question"><h3>对阅读系统的其他意见（选填）</h3><textarea id="sus-feedback" class="thin-select" rows="3">${clean(u.feedback||'')}</textarea></section><div class="error" id="sus-error"></div><button class="btn primary mt22" id="sus-submit">提交可用性评价，结束实验</button></div></div>`}
function startUsabilityTask(){const u=current.usability;if(!u.currentTaskStartedAt){u.currentTaskStartedAt=now();u.currentTaskEvents=[];save()}const m=MATERIALS.JA;selectedMaterial='JA';if(!u.demoTask)u.demoTask={id:uid(),material:'JA',condition:'C2',privateNotes:[],events:[],reading:{maxScroll:0}};activePara=m.paragraphs[0].id;activeAI=null;activeNote=null;showSource=false;view='usabilityReader';render()}
function pageUsabilityReader(){let task=current.usability.demoTask||{privateNotes:[],events:[],reading:{maxScroll:0}};let index=current.usability.taskIndex;return `<div class="notice blue" style="margin:8px 25px 4px">可用性测试 ${index+1}/3：${clean(UTASKS[index].desc)} <button class="btn tiny" id="return-utask" style="margin-left:13px">返回任务界面</button></div>${readingContent(task,true)}`}
function usabilityEvent(type){if(view!=='usabilityReader')return;const u=current.usability;u.currentTaskEvents=u.currentTaskEvents||[];u.currentTaskEvents.push({at:now(),type});const x=UTASKS[u.taskIndex];if(type===x.requires){finishUsabilityTask(true)}}
function finishUsabilityTask(success){const u=current.usability,i=u.taskIndex;if(!u.currentTaskStartedAt)u.currentTaskStartedAt=now();u.results[i]={task:i+1,name:UTASKS[i].title,success,done:true,durationSeconds:Math.max(0,Math.round((Date.now()-Date.parse(u.currentTaskStartedAt))/1000)),seq:null,events:u.currentTaskEvents||[]};u.currentTaskStartedAt=null;u.currentTaskEvents=[];save();view='usability';render();notice(success?'操作任务完成，请评价难易度':'已记录为未完成，请评价难易度')}
function nextUsabilityTask(){let u=current.usability,res=u.results[u.taskIndex],r=document.querySelector('input[name="seq"]:checked');if(!r){notice('请先填写 SEQ 任务难易度');return}res.seq=Number(r.value);u.taskIndex++;save();render()}
function susSubmit(){const u=current.usability;let ans=[];for(let i=0;i<10;i++){const r=document.querySelector(`input[name="sus${i}"]:checked`);if(!r){$('sus-error').textContent='请完成 SUS 十道题';return}ans.push(Number(r.value))}u.sus=ans;u.feedback=$('sus-feedback').value.trim();u.score=Math.round(ans.reduce((sum,v,i)=>sum+(i%2===0?v-1:5-v),0)*2.5*10)/10;u.endedAt=now();current.status='completed';current.completedAt=now();save();view='done';render()}
function pageDone(){const d=doneCount(),u=current.usability;return `<div class="intro"><div class="eyebrow">STUDY COMPLETED</div><h1>${isDemo()?'演示阅读已完成':'本次模拟实验已完成'}</h1>${stepper(4)}<div class="card"><p class="lead">实验号 <strong>${clean(current.id)}</strong> 的记录已保存至当前浏览器。</p><div class="review-box"><div class="metric"><b>${d}</b><span>已提交阅读问卷</span></div><div class="metric"><b>${fmt(current.tasks.reduce((a,t)=>a+(t.reading?.wallSeconds||0),0))}</b><span>合计阅读时间</span></div><div class="metric"><b>${typeof u.score==='number'?u.score:'—'}</b><span>SUS 分数（演示）</span></div></div><div class="notice mt22">本地原型不具备跨设备自动同步或正式身份认证。请及时导出数据；删除浏览器数据会永久移除本机记录。</div><div class="flex gap12 wrap mt22"><button class="btn primary" id="download-own">下载本次完整 JSON 报告</button><button class="btn" id="done-reports">查看研究者报告</button><button class="btn" id="done-home">返回入口</button></div></div></div>`}
function allSessions(){return Object.values(db.sessions)}
function taskRow(s,t){return {participant:s.id,mode:s.mode,allocation:s.allocation,round:t.index,material:t.material,condition:t.condition,status:t.status,started_at:t.reading?.startAt||'',ended_at:t.reading?.endAt||'',reading_wall_seconds:t.reading?.wallSeconds??'',reading_visible_seconds:t.reading?Math.round((t.reading.visibleMs||0)/1000):'',survey_seconds:t.survey?.durationSeconds??'',culture_score:t.survey?.culturalScore??'',culture_max:t.survey?.maxScore??'',interpretation:t.survey?.interpretation||'',effort:t.survey?.effort??'',flow:t.survey?.flow??'',agency:t.survey?.agency??'',perspective:t.survey?.perspective??'',comment:t.survey?.feedback||'',events:t.events.length,private_notes:t.privateNotes.length}}
function reportPage(){const sessions=allSessions().filter(s=>s.consentAt),study=sessions.filter(s=>s.mode==='study'),tasks=sessions.flatMap(s=>s.tasks.filter(t=>t.reading).map(t=>taskRow(s,t))),completed=sessions.filter(s=>s.status==='completed').length;const chosen=current&&sessions.find(s=>s.id===current.id);return `<div class="library-wrap"><div class="eyebrow">LOCAL RESEARCH DASHBOARD</div><h1>研究者数据报告</h1><div class="notice rose"><strong>本机演示管理页面。</strong>这里没有账户权限或服务端加密，不能作为正式实验的安全管理后台。不同电脑的数据不会自动合并。</div><div class="review-box mt22"><div class="metric"><b>${sessions.length}</b><span>本机同意的实验会话</span></div><div class="metric"><b>${tasks.length}</b><span>有记录的阅读任务</span></div><div class="metric"><b>${completed}</b><span>完成全部流程</span></div></div><div class="card mt22"><h2 class="section-title">数据导出</h2><p class="small muted">默认保留真实回答及操作时间戳；中文 CSV 使用 UTF-8 BOM，可直接用 Excel 打开。只汇总当前浏览器数据。</p><div class="flex gap8 wrap"><button class="btn primary" data-export="alljson">下载所有会话 JSON</button><button class="btn" data-export="attempts">阅读与问卷 CSV</button><button class="btn" data-export="events">交互事件 CSV</button><button class="btn" data-export="surveys">完整逐题回答 CSV</button><button class="btn" data-export="participants">参与者状态 CSV</button></div></div><div class="card mt22"><h2 class="section-title">参与者记录</h2><div class="scroll-x"><table class="report-table"><thead><tr><th>实验号</th><th>模式 / 分配</th><th>阅读轮次</th><th>实验状态</th><th>总阅读用时</th><th>报告</th></tr></thead><tbody>${sessions.map(s=>`<tr><td><strong>${clean(s.id)}</strong></td><td>${s.mode} / ${s.allocation}</td><td>${s.tasks.filter(t=>t.status==='done').length} / ${s.mode==='study'?3:s.tasks.length}</td><td>${clean(s.status)}</td><td>${fmt(s.tasks.reduce((a,t)=>a+(t.reading?.wallSeconds||0),0))}</td><td><button class="btn tiny" data-participant="${clean(s.id)}">查看 / 导出</button></td></tr>`).join('')||'<tr><td colspan="6">本机尚无实验记录。</td></tr>'}</tbody></table></div></div><div class="card mt22"><h2 class="section-title">抗序矩阵（6 种方案）</h2><div class="scroll-x"><table class="report-table"><thead><tr><th>方案</th><th>B</th><th>C1</th><th>C2</th><th>实际执行顺序</th></tr></thead><tbody>${PLAN.map(p=>`<tr><td>${p.id}</td><td>${p.assign.B}</td><td>${p.assign.C1}</td><td>${p.assign.C2}</td><td>${p.order.join(' → ')}</td></tr>`).join('')}</tbody></table></div><div class="small muted mt12">每六个连续实验编号平衡一次：每篇材料 × 每个条件出现 2 次；每种条件及每篇材料在三轮中的位置也各出现 2 次。</div></div><div class="mt22 flex between wrap gap12"><button class="btn" id="report-home">返回入口</button><button class="btn danger" id="reset-local">清空本机所有实验记录</button></div></div>`}
function renderParticipant(id){const s=db.sessions[id];if(!s)return;let rows=s.tasks.map(t=>taskRow(s,t));view='participantReport';window.reportID=id;render()}
function pageParticipant(){const s=db.sessions[window.reportID];if(!s)return '<div class="intro">记录不存在</div>';return `<div class="library-wrap"><div class="eyebrow">INDIVIDUAL RESEARCH REPORT</div><h1>${clean(s.id)} · 完整会话报告</h1><div class="flex gap12 wrap"><button class="btn" id="participant-back">返回报告总览</button><button class="btn primary" id="participant-export">下载该参与者 JSON</button></div><div class="card mt22"><h2 class="section-title">实验概况</h2><p class="small">编号 ${clean(s.id)} · ${s.mode} · 抗序方案 ${s.allocation} · 登记 ${pretty(s.consentAt)} · 状态 ${s.status}<br>阅读总用时 ${fmt(s.tasks.reduce((a,t)=>a+(t.reading?.wallSeconds||0),0))} · 已提交问卷耗时 ${fmt(s.tasks.reduce((a,t)=>a+(t.survey?.durationSeconds||0),0))} · 会话经过时间 ${s.consentAt&&s.completedAt?fmt((Date.parse(s.completedAt)-Date.parse(s.consentAt))/1000):'尚未完成'}</p><div class="scroll-x"><table class="report-table"><thead><tr><th>轮次</th><th>文学材料</th><th>条件</th><th>阅读用时</th><th>文化理解</th><th>开放阐释</th><th>量表</th></tr></thead><tbody>${s.tasks.filter(t=>t.reading).map(t=>`<tr><td>${t.index}</td><td>${t.material}</td><td>${t.condition}</td><td>${fmt(t.reading?.wallSeconds||0)}<div class="fine">可见 ${fmt((t.reading?.visibleMs||0)/1000)}</div></td><td>${t.survey?.culturalScore??'—'} / ${t.survey?.maxScore??3}</td><td style="max-width:230px;line-height:1.7">${clean(t.survey?.interpretation||'未提交')}</td><td class="small">心智:${t.survey?.effort??'—'}<br>流畅:${t.survey?.flow??'—'}<br>自主:${t.survey?.agency??'—'}<br>视角:${t.survey?.perspective??'—'}</td></tr>`).join('')}</tbody></table></div></div><div class="card mt22"><h2 class="section-title">完整逐题回答</h2>${s.tasks.filter(t=>t.survey).map(t=>`<div class="question"><b>第 ${t.index} 轮 · ${t.material} · ${t.condition}</b><div class="small mt12">${MATERIALS[t.material].questions.map(q=>`<p><b>${clean(q.q)}</b>：${clean(q.options[t.survey[q.id]]||'—')}</p>`).join('')}<p><b>文学阐释：</b>${clean(t.survey.interpretation)}</p><p><b>补充回答：</b>${clean(t.survey.feedback||'（无）')}</p></div></div>`).join('')||'无已提交问卷'}</div><div class="card mt22"><h2 class="section-title">可用性测试</h2><p class="small">SUS：${s.usability.score??'未完成'}；任务记录：${s.usability.results.map(r=>`${r.name} (${r.success?'成功':'失败'}, ${fmt(r.durationSeconds)}, SEQ ${r.seq??'—'})`).join('；')||'无'}</p><p class="small">SUS 逐题：${s.usability.sus.join('、')||'无'}</p></div><div class="card mt22"><h2 class="section-title">个人批注与行为日志</h2>${s.tasks.filter(t=>t.events.length||t.privateNotes.length).map(t=>`<div class="question"><h3>Round ${t.index} · ${t.material} · ${t.condition}</h3>${t.privateNotes.length?`<p class="small">私人批注：${t.privateNotes.map(n=>`${clean(n.pid)}：${clean(n.text)}`).join('；')}</p>`:''}<details><summary class="small">查看 ${t.events.length} 条事件</summary><pre class="small" style="white-space:pre-wrap;max-height:220px;overflow:auto">${clean(JSON.stringify(t.events,null,2))}</pre></details></div>`).join('')}</div></div>`}
function download(text,filename,mime='text/plain;charset=utf-8'){const blob=new Blob([text],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function cesc(v){let s=String(v??'');if(/^[=+\-@\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function csv(rows){if(!rows.length)return '\ufeff';const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];return '\ufeff'+keys.join(',')+'\r\n'+rows.map(r=>keys.map(k=>cesc(r[k])).join(',')).join('\r\n')}
function exportData(kind){const s=allSessions();let rows=[],filename='LDreader_'+kind+'.csv';if(kind==='alljson'){download(JSON.stringify({exportedAt:now(),note:'Demo data from local single-browser prototype',sessions:s},null,2),'LDreader_all_sessions.json','application/json');return}
if(kind==='attempts')rows=s.flatMap(a=>a.tasks.map(t=>taskRow(a,t)));
else if(kind==='participants')rows=s.map(x=>({participant:x.id,mode:x.mode,allocation:x.allocation,status:x.status,consented_at:x.consentAt||'',completed_at:x.completedAt||'',read_completed:x.tasks.filter(t=>t.status==='done').length,sus_score:x.usability.score??''}));
else if(kind==='events')rows=s.flatMap(x=>x.tasks.flatMap(t=>t.events.map(e=>({participant:x.id,attempt:t.id,material:t.material,condition:t.condition,at:e.at,event:e.type,payload:JSON.stringify(e.payload)}))));
else if(kind==='surveys')rows=s.flatMap(x=>x.tasks.filter(t=>t.survey).flatMap(t=>Object.entries(t.survey).filter(([k])=>k!=='draft').map(([k,v])=>({participant:x.id,round:t.index,material:t.material,condition:t.condition,question_id:k,answer:typeof v==='object'?JSON.stringify(v):v}))));
download(csv(rows),filename,'text/csv;charset=utf-8')}
function render(){if(view!=='reading'&&view!=='usabilityReader'){renderScroll=0}header();let html={entry:pageEntry,consent:pageConsent,library:pageLibrary,reading:pageReading,survey:pageSurvey,usability:pageUsability,usabilityReader:pageUsabilityReader,done:pageDone,reports:reportPage,participantReport:pageParticipant}[view]();$('app').innerHTML=html;attach();if(view==='reading'||view==='usabilityReader'){const b=$('reader-scroll');b.scrollTop=renderScroll;const f=()=>{let max=b.scrollHeight-b.clientHeight;let pct=max>0?Math.round(100*b.scrollTop/max):100;const t= view==='reading'?liveTask():current.usability.demoTask;if(t?.reading){t.reading.maxScroll=Math.max(t.reading.maxScroll||0,pct);$('scroll-bar').style.width=t.reading.maxScroll+'%'}let n=Date.now();if(n-interactDebounce>900){interactDebounce=n;if(view==='reading'){log('SCROLL',{ratio:pct});save()}}};b.addEventListener('scroll',f,{passive:true});}else window.scrollTo({top:0,behavior:'instant'})}
function attach(){const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('click',fn)};
if(view==='entry')on('entry-start',startEntry);
if(view==='consent')on('consent-next',consentNext);
if(view==='library'){document.querySelectorAll('[data-library-material]').forEach(el=>el.onclick=()=>libraryClick(el.dataset.libraryMaterial));on('lib-reports',()=>{view='reports';render()});const s=$('demo-condition');if(s)s.onchange=()=>{demoCondition=s.value;render()}}
if(view==='reading'){on('finish-read',finishReading);attachReader(false)}
if(view==='usabilityReader'){on('return-utask',()=>{view='usability';render()});attachReader(true)}
if(view==='survey'){
const t=current.tasks.find(x=>x.status==='survey');
if(!t.survey?.startedAt){t.survey={...t.survey,startedAt:now(),draft:t.survey?.draft||{}};save()}
// 本轮问卷逐题自动保存草稿，刷新网页后能继续填写。
const persistDraft=()=>{if(!t.survey?.draft)t.survey.draft={};const d=t.survey.draft;for(const q of MATERIALS[t.material].questions){const r=document.querySelector(`input[name="${q.id}"]:checked`);if(r)d[q.id]=Number(r.value)}for(const key of ['effort','flow','agency','perspective']){const r=document.querySelector(`input[name="${key}"]:checked`);if(r)d[key]=Number(r.value)}d.interpretation=$('interpretation').value;d.feedback=$('feedback').value;save()};
document.querySelectorAll('#app input[type="radio"]').forEach(el=>el.addEventListener('change',persistDraft));
document.querySelectorAll('#app textarea').forEach(el=>el.addEventListener('input',persistDraft));
on('survey-submit',surveySubmit)
}
if(view==='usability'){on('task-launch',startUsabilityTask);on('task-skip',()=>finishUsabilityTask(false));on('task-next',nextUsabilityTask);on('sus-submit',susSubmit)}
if(view==='done'){on('download-own',()=>download(JSON.stringify(current,null,2),current.id+'_report.json','application/json'));on('done-reports',()=>{view='reports';render()});on('done-home',()=>{view='entry';render()})}
if(view==='reports'){document.querySelectorAll('[data-export]').forEach(el=>el.onclick=()=>exportData(el.dataset.export));document.querySelectorAll('[data-participant]').forEach(el=>el.onclick=()=>renderParticipant(el.dataset.participant));on('report-home',()=>{view='entry';render()});on('reset-local',()=>{if(prompt('此操作不可撤销。输入 CLEAR 确认清空本机所有记录：')!=='CLEAR')return;db={sessions:{},meta:{created_at:now()}};current=null;save();notice('本机数据已清空');render()})}
if(view==='participantReport'){on('participant-back',()=>{view='reports';render()});on('participant-export',()=>{const s=db.sessions[window.reportID];download(JSON.stringify(s,null,2),s.id+'_full_report.json','application/json')})}
}
function locate(pid){saveReaderScroll();activePara=pid;render();let el=$(pid),box=$('reader-scroll');if(el&&box){box.scrollTop=Math.max(0,el.offsetTop-box.offsetTop-30);renderScroll=box.scrollTop}}
function attachReader(usable){const t=usable?current.usability.demoTask:liveTask(),m=MATERIALS[t.material];document.querySelectorAll('[data-ai-open]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-ai-source]'))return;const ai=m.ai.find(a=>a.id===el.dataset.aiOpen);saveReaderScroll();activeAI=ai.id;showSource=false;log('AI_OPEN',{ai:ai.id,paragraph:ai.pid},usable?t:null);if(usable){current.usability.currentTaskEvents.push({at:now(),type:'ai_open'})}locate(ai.pid)});
document.querySelectorAll('[data-ai-source]').forEach(el=>el.onclick=e=>{e.stopPropagation();saveReaderScroll();activeAI=el.dataset.aiSource;showSource=true;log('AI_SOURCE_OPEN',{ai:activeAI},usable?t:null);if(usable)usabilityEvent('ai_source_open');if(view==='usabilityReader'||view==='reading')render()});
document.querySelectorAll('[data-note-open]').forEach(el=>el.onclick=()=>{const note=m.notes.find(n=>n.id===el.dataset.noteOpen);saveReaderScroll();activeNote=note.id;log('ANNOTATION_OPEN',{note:note.id,paragraph:note.pid},usable?t:null);if(usable)current.usability.currentTaskEvents.push({at:now(),type:'annotation_open'});locate(note.pid)});
document.querySelectorAll('[data-para]').forEach(el=>el.onclick=()=>{if(!usable&&t.condition==='B')return;let id=el.dataset.para;saveReaderScroll();activePara=id;if(usable)usabilityEvent('paragraph_open');else log('PARAGRAPH_FOCUS',{pid:id});if(view==='reading'||view==='usabilityReader')render()});
const sel=$('anchor-select');if(sel)sel.onchange=()=>{activePara=sel.value};const saveBtn=$('save-private-note');if(saveBtn)saveBtn.onclick=()=>{const text=$('private-note').value.trim();if(!text){notice('请输入批注内容');return}const anchor=$('anchor-select').value;t.privateNotes.push({id:uid(),pid:anchor,text,createdAt:now()});log('ANNOTATION_CREATE',{pid:anchor,length:text.length},usable?t:null);saveReaderScroll();if(usable)usabilityEvent('private_annotation_add');else {save();render();notice('私人批注已保存')}};
}
window.addEventListener('visibilitychange',()=>{if(view==='reading'){const t=liveTask();if(!t?.reading)return;syncReading();log(document.hidden?'TAB_HIDDEN':'TAB_VISIBLE');t.reading.lastTick=Date.now();save()}});
window.addEventListener('pagehide',()=>{if(view==='reading')syncReading()});
// 入口不自动恢复上一位受试者；输入原实验编号即可恢复本机已保存的任务。
render();
})();
</script>
</body>
</html>
